<script>

console.log(isPrime(7));

 function isPrime(num){
        //return num < 2 && false;
        if(num < 2) return false ;
        for(let i = 2; i < num; i++){
            if(num % i === 0){
             console.log('not a prime number' + num);  
             return false;
            }
            console.log(`valid prime number ${num}`);
        }
    }

console.log(isPrime(7));
