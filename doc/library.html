<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DroBoard — Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Reusable components: search overlay turns any [data-search-trigger] element
     into a search-opening control, bottom nav builds + appends itself to <body>.
     See component/search-overlay.js and component/bottom-nav.js. -->
<script src="component/search-overlay.js"></script>
<script src="component/bottom-nav.js"></script>
<style>
  :root{
    --pink:#E91E63; --pink-deep:#C2185B; --pink-soft:#FCE7F3;
    --purple:#7C3AED; --purple-deep:#6D28D9; --purple-soft:#F1EBFF;
    --blue:#3B82F6; --blue-soft:#EAF2FE;
    --green:#10B981; --green-soft:#E7FBF3;
    --orange:#F59E0B; --orange-soft:#FEF3E2;
    --ink:#161620; --ink-2:#3A3650; --gray-600:#65627a; --gray-400:#9793a8;
    --line:#EDEDF2; --divider:#F0F1F5; --white:#FFFFFF;
    --grid-gap:10px;
    --font-display:'Manrope',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--divider);}
  body{font-family:var(--font-body);color:var(--ink);display:flex;justify-content:center;min-height:100vh;overflow-x:hidden;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  img{display:block;object-fit:cover;}
  svg.ic{display:block;flex-shrink:0;}
  ::-webkit-scrollbar{display:none;}

  .phone{width:100%;max-width:420px;min-height:100vh;background:var(--white);position:relative;box-shadow:0 0 50px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow-x:hidden;}

  /* ===== HEADER ===== */
  .topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 16px 11px;}
  .logo{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
  .logo span{color:var(--pink);}
  .top-actions{display:flex;gap:8px;}
  .icon-btn{width:37px;height:37px;border-radius:50%;background:var(--divider);display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink-2);}
  .icon-btn.pink{background:var(--pink-soft);color:var(--pink-deep);}
  .badge-dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--pink);border:2px solid var(--white);}

  /* ===== TABS ===== */
  .tabs{display:flex;gap:22px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--white);overflow-x:auto;}
  .tab{padding:11px 0;font-size:13.5px;font-weight:600;color:var(--gray-400);white-space:nowrap;position:relative;cursor:pointer;}
  .tab.active{color:var(--pink);font-weight:700;}
  .tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:3px;background:var(--pink);}

  .content{flex:1;padding-bottom:90px;background:var(--white);}

  /* ===== STATS STRIP ===== */
  .stats-strip{display:flex;gap:10px;padding:14px 16px 6px;overflow-x:auto;}
  .stat-chip{
    flex:1;min-width:0;background:var(--divider);border-radius:12px;padding:12px 10px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .stat-num{font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--ink);}
  .stat-label{font-size:10.5px;font-weight:600;color:var(--gray-600);}

  /* ===== PROMO SLIDER ===== */
  .promo-row{padding:12px 16px 4px;}
  .promo-slider{
    position:relative;width:100%;height:87px;border-radius:14px;
    overflow:hidden;background:var(--divider);
  }
  .promo-track{display:flex;width:100%;height:100%;will-change:transform;transition:transform .45s cubic-bezier(.4,0,.2,1);}
  .promo-slide{
    flex:0 0 100%;width:100%;height:100%;min-width:0;position:relative;
    display:flex;align-items:center;gap:10px;padding:0 12px;
    background-size:cover;background-position:center;cursor:pointer;
  }
  .promo-scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,6,14,.82) 0%,rgba(10,6,14,.45) 58%,rgba(10,6,14,.08) 100%);}
  .promo-text{position:relative;z-index:2;min-width:0;flex:1;}
  .promo-eyebrow{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#ff9db8;margin-bottom:3px;}
  .promo-title{font-size:12.5px;font-weight:700;color:#fff;line-height:1.28;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .promo-author{font-size:10px;color:rgba(255,255,255,.72);margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .promo-cta{
    position:relative;z-index:2;flex-shrink:0;background:#fff;color:var(--pink-deep);
    font-size:10px;font-weight:800;padding:7px 13px;border-radius:16px;white-space:nowrap;
  }
  .promo-dots{position:absolute;bottom:7px;right:10px;z-index:3;display:flex;gap:4px;}
  .promo-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.45);transition:.25s;}
  .promo-dot.on{width:12px;border-radius:3px;background:#fff;}

  /* ===== SECTION ===== */
  .section{margin-top:8px;}
  .sec-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;}
  .sec-title{font-size:15.5px;font-weight:700;}
  .view-all{font-size:12.5px;font-weight:600;color:var(--gray-400);}

  /* ===== VIEW TOGGLE ===== */
  .view-toggle{display:flex;gap:4px;background:var(--divider);border-radius:10px;padding:3px;}
  .view-btn{
    width:32px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--gray-400);transition:all .15s ease;
  }
  .view-btn.active{background:var(--white);color:var(--pink);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  /* ===== CONTINUE READING
     Cards are sized identically to the library grid cards (.gcard):
     same cover aspect ratio, radius, progress bar, badge and text scale.
     flex-basis uses the same (100% - 2*gap)/3 formula as the grid so the
     rendered pixel size matches exactly, even though this row scrolls
     horizontally instead of wrapping. ===== */
  .h-row{display:flex;gap:var(--grid-gap);overflow-x:auto;padding:0 16px 8px;scrollbar-width:none;}
  .h-row::-webkit-scrollbar{display:none;}
  .cont-card{flex:0 0 calc((100% - (var(--grid-gap) * 2))/3);width:calc((100% - (var(--grid-gap) * 2))/3);min-width:0;cursor:pointer;}
  .cont-cover{position:relative;width:100%;aspect-ratio:110/148;border-radius:9px;overflow:hidden;background:var(--line);margin-bottom:6px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
  .cont-cover img{width:100%;height:100%;}
  .cont-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.2);}
  .cont-prog-fill{height:100%;background:var(--pink);}
  .cont-badge{position:absolute;top:5px;left:5px;font-size:8px;font-weight:800;padding:2px 5px;border-radius:4px;background:var(--pink);color:#fff;letter-spacing:.02em;}
  .cont-title{font-size:11px;font-weight:700;line-height:1.3;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .cont-meta{font-size:10px;color:var(--gray-400);font-weight:500;}

  /* ===== FILTER CHIPS ===== */
  .filter-row{display:flex;gap:8px;padding:6px 16px 10px;overflow-x:auto;}
  .filter-chip{
    flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:600;
    background:var(--divider);color:var(--gray-600);border:1.5px solid transparent;cursor:pointer;
  }
  .filter-chip.active{background:var(--pink-soft);color:var(--pink-deep);border-color:#f8d3e2;}

  /* ===== LIST VIEW ===== */
  .lib-list{padding:0 16px;}
  .lib-item{
    display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .lib-item:last-child{border-bottom:none;}
  .lib-item:active{opacity:.88;}
  .lib-cover{
    width:72px;height:96px;border-radius:8px;overflow:hidden;flex-shrink:0;
    background:var(--line);box-shadow:0 2px 6px rgba(0,0,0,.06);position:relative;
  }
  .lib-cover img{width:100%;height:100%;}
  .lib-body{flex:1;min-width:0;display:flex;flex-direction:column;padding-top:2px;}
  .lib-title{font-size:14.5px;font-weight:700;line-height:1.3;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lib-author{font-size:12px;color:var(--gray-400);font-weight:500;margin-bottom:6px;}
  .lib-preview{font-size:12px;color:var(--gray-600);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px;flex:1;}
  .lib-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;}
  .lib-ch{font-size:11.5px;font-weight:600;color:var(--pink);}
  .lib-pct{font-size:11px;color:var(--gray-400);font-weight:500;}
  .lib-actions{display:flex;gap:6px;flex-shrink:0;}
  .lib-act{
    width:32px;height:32px;border-radius:50%;background:var(--divider);
    display:flex;align-items:center;justify-content:center;color:var(--gray-600);
  }
  .lib-act.on{background:var(--pink-soft);color:var(--pink-deep);}

  /* ===== GRID VIEW (3 per row, default) ===== */
  .lib-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px var(--grid-gap);
    padding:0 16px 16px;
  }
  .gcard{cursor:pointer;min-width:0;}
  .gcard:active{opacity:.88;}
  .gcard-cover{
    position:relative;width:100%;aspect-ratio:110/148;
    border-radius:9px;overflow:hidden;background:var(--line);margin-bottom:6px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
  }
  .gcard-cover img{width:100%;height:100%;}
  .gcard-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.2);}
  .gcard-prog-fill{height:100%;background:var(--pink);}
  .gcard-badge{
    position:absolute;top:5px;left:5px;font-size:8px;font-weight:800;
    padding:2px 5px;border-radius:4px;background:var(--pink);color:#fff;
  }
  .gcard-badge.done{background:var(--green);}
  .gcard-title{
    font-size:11px;font-weight:700;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px;
  }
  .gcard-meta{font-size:10px;color:var(--gray-400);font-weight:500;}

  /* ===== PAGINATION (Your Library section) ===== */
  .pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 16px 18px;flex-wrap:wrap;}
  .page-btn{min-width:32px;height:32px;padding:0 8px;border-radius:9px;background:var(--divider);
    color:var(--ink-2);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .page-btn.active{background:var(--pink);color:#fff;}
  .page-btn.nav{color:var(--gray-600);}
  .page-btn.disabled{opacity:.35;pointer-events:none;}

  /* ===== EMPTY STATE ===== */
  .empty{padding:48px 24px;text-align:center;}
  .empty-icon{width:64px;height:64px;border-radius:18px;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--pink);}
  .empty-title{font-family:var(--font-display);font-size:17px;font-weight:800;margin-bottom:6px;}
  .empty-sub{font-size:13.5px;color:var(--gray-400);line-height:1.5;margin-bottom:18px;}
  .empty-btn{background:var(--pink);color:#fff;padding:11px 22px;border-radius:12px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;}

  .panel{display:none;}
  .panel.active{display:block;}

  /* ===== RESPONSIVE ===== */
  @media (max-width:360px){
    :root{--grid-gap:8px;}
    .gcard-title{font-size:10.5px;}
    .lib-cover{width:64px;height:86px;}
    .promo-title{max-width:150px;}
  }
  @media (min-width:421px){
    .phone{border-radius:0;}
  }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="logo">Dro<span>Board</span></div>
    <div class="top-actions">
      <div class="icon-btn" id="search-btn" data-search-trigger></div>
      <div class="icon-btn" id="bell-btn"></div>
      <div class="icon-btn pink" id="gift-btn"></div>
    </div>
  </div>

  <div class="tabs" id="main-tabs">
    <div class="tab active" data-panel="reading">Reading</div>
    <div class="tab" data-panel="saved">Saved</div>
    <div class="tab" data-panel="history">History</div>
    <div class="tab" data-panel="downloads">Downloads</div>
  </div>

  <div class="content" id="content">

    <!-- ========== READING PANEL ========== -->
    <div class="panel active" id="panel-reading">
      <div class="stats-strip">
        <div class="stat-chip"><div class="stat-num">12</div><div class="stat-label">In Progress</div></div>
        <div class="stat-chip"><div class="stat-num">7</div><div class="stat-label">Finished</div></div>
        <div class="stat-chip"><div class="stat-num">48</div><div class="stat-label">Hours Read</div></div>
      </div>

      <div class="promo-row">
        <div class="promo-slider" id="promo-slider">
          <div class="promo-track" id="promo-track"></div>
          <div class="promo-dots" id="promo-dots"></div>
        </div>
      </div>

      <div class="section">
        <div class="sec-head">
          <h2 class="sec-title">Continue Reading</h2>
          <span class="view-all">View All ›</span>
        </div>
        <div class="h-row" id="continue-row"></div>
      </div>

      <div class="section">
        <div class="sec-head">
          <h2 class="sec-title">Your Library</h2>
          <div class="view-toggle" id="view-toggle">
            <button class="view-btn" data-view="list" id="btn-list" title="List view"></button>
            <button class="view-btn active" data-view="grid" id="btn-grid" title="Grid view"></button>
          </div>
        </div>
        <div class="filter-row" id="filter-row">
          <div class="filter-chip active" data-filter="all">All</div>
          <div class="filter-chip" data-filter="progress">In Progress</div>
          <div class="filter-chip" data-filter="finished">Finished</div>
          <div class="filter-chip" data-filter="unread">Unread</div>
        </div>
        <div id="lib-container"></div>
        <div class="pagination" id="lib-pagination"></div>
      </div>
    </div>

    <!-- ========== SAVED PANEL ========== -->
    <div class="panel" id="panel-saved">
      <div class="section" style="margin-top:4px;">
        <div class="sec-head">
          <h2 class="sec-title">Saved Stories</h2>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="view-all" id="saved-count">0</span>
            <div class="view-toggle" id="saved-toggle">
              <button class="view-btn" data-view="list" data-target="saved" title="List view"></button>
              <button class="view-btn active" data-view="grid" data-target="saved" title="Grid view"></button>
            </div>
          </div>
        </div>
        <div id="saved-container"></div>
      </div>
    </div>

    <!-- ========== HISTORY PANEL ========== -->
    <div class="panel" id="panel-history">
      <div class="section" style="margin-top:4px;">
        <div class="sec-head">
          <h2 class="sec-title">Recently Read</h2>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="view-all">Clear ›</span>
            <div class="view-toggle" id="history-toggle">
              <button class="view-btn" data-view="list" data-target="history" title="List view"></button>
              <button class="view-btn active" data-view="grid" data-target="history" title="Grid view"></button>
            </div>
          </div>
        </div>
        <div id="history-container"></div>
      </div>
    </div>

    <!-- ========== DOWNLOADS PANEL ========== -->
    <div class="panel" id="panel-downloads">
      <div class="empty" id="downloads-empty">
        <div class="empty-icon" id="empty-ic"></div>
        <div class="empty-title">No downloads yet</div>
        <div class="empty-sub">Download chapters to read offline.<br>Your downloads will appear here.</div>
        <button class="empty-btn" id="empty-btn">Browse Stories</button>
      </div>
    </div>

  </div>

  <!-- Bottom nav is no longer hand-rolled here — component/bottom-nav.js
       builds it and appends it to <body> automatically, with "Library"
       auto-detected as the active tab from this page's filename. -->
</div>

<script>
/* ============ ICON SET ============ */
const ICONS={
  bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  search:'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  checkCircle:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
  folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  more:'<circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/><circle cx="5" cy="12" r="1.4"/>',
  bookmark:'<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
  list:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  chevronLeft:'<polyline points="15 18 9 12 15 6"/>',
  chevronRight:'<polyline points="9 18 15 12 9 6"/>'
};
function icon(name,{size=18,stroke=2,color}={}){
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color||'currentColor'}" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}

/* ============ COVERS ============ */
const COVERS = [
  'https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=400&h=540&fit=crop',
  'https://images.unsplash.com/photo-1495640388908-05fa85288e61?w=400&h=540&fit=crop',
  'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=400&h=540&fit=crop',
  'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400&h=540&fit=crop',
  'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400&h=540&fit=crop',
  'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=400&h=540&fit=crop',
  'https://images.unsplash.com/photo-1481277542470-605612bd2d61?w=400&h=540&fit=crop',
  'https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=400&h=540&fit=crop',
  'https://images.unsplash.com/photo-1476275466078-4007374efbbe?w=400&h=540&fit=crop',
  'https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=400&h=540&fit=crop'
];
const c = i => COVERS[i % COVERS.length];

/* ============ DATA ============ */
const CONTINUE = [
  { title:"His Sweet Revenge", author:"Luna Grey", ch:"Ch. 21", pct:68, img:c(0), badge:"Update" },
  { title:"Forbidden Hearts", author:"Mia Clark", ch:"Ch. 9", pct:42, img:c(1) },
  { title:"The Alpha's Obsession", author:"Ifeanyi Story", ch:"Ch. 18", pct:55, img:c(2) },
  { title:"Bound to the CEO", author:"Ava Winters", ch:"Ch. 14", pct:31, img:c(3) },
  { title:"Burn For Me, Elsa", author:"Ada Writes", ch:"Ch. 33", pct:89, img:c(4) },
];

const PROMO = [

/* ============ VIEW / PAGINATION STATE ============ */
let currentView = { reading:'grid', saved:'grid', history:'grid' };
let currentFilter = 'all';
let libPage = 1;
const LIB_PAGE_SIZE = 6; // 2 rows of 3 in grid view

/* ============ RENDER HELPERS ============ */
function contCard(s){
  const badge = s.badge ? `<span class="cont-badge">${s.badge}</span>` : '';
  return `<div class="cont-card">
    <div class="cont-cover">
      <img src="${s.img}" alt="" loading="lazy"/>
      ${badge}
      <div class="cont-prog"><div class="cont-prog-fill" style="width:${s.pct}%"></div></div>
    </div>
    <div class="cont-title">${s.title}</div>
    <div class="cont-meta">${s.ch} · ${s.pct}%</div>
  </div>`;
}

function listItem(s, opts={}){
  const showBookmark = opts.bookmark !== false;
  const bookmarked = opts.bookmarked || false;
  return `<div class="lib-item">
    <div class="lib-cover"><img src="${s.img}" alt="" loading="lazy"/></div>
    <div class="lib-body">
      <div class="lib-title">${s.title}</div>
      <div class="lib-author">${s.author}</div>
      <div class="lib-preview">${s.preview}</div>
      <div class="lib-foot">
        <div>
          <div class="lib-ch">${s.ch}</div>
          ${s.pct>0 && s.pct<100 ? `<div class="lib-pct">${s.pct}% complete</div>` : ''}
        </div>
        <div class="lib-actions">
          ${showBookmark ? `<div class="lib-act ${bookmarked?'on':''} bookmark-btn">${icon('bookmark',{size:15})}</div>` : ''}
          <div class="lib-act more-btn">${icon('more',{size:15})}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function gridCard(s){
  let badge = '';
  if(s.status==='finished') badge = `<span class="gcard-badge done">Done</span>`;
  else if(s.pct>0 && s.pct<100) badge = `<span class="gcard-badge">${s.pct}%</span>`;
  else if(s.status==='unread') badge = `<span class="gcard-badge" style="background:var(--blue)">New</span>`;
  return `<div class="gcard">
    <div class="gcard-cover">
      <img src="${s.img}" alt="" loading="lazy"/>
      ${badge}
      ${s.pct>0 && s.pct<100 ? `<div class="gcard-prog"><div class="gcard-prog-fill" style="width:${s.pct}%"></div></div>` : ''}
    </div>
    <div class="gcard-title">${s.title}</div>
    <div class="gcard-meta">${s.ch}</div>
  </div>`;
}

function renderItems(items, view, containerId, opts={}){
  const el = document.getElementById(containerId);
  if(view==='grid'){
    el.innerHTML = `<div class="lib-grid">${items.map(gridCard).join('')}</div>`;
  } else {
    el.innerHTML = `<div class="lib-list">${items.map(s=>listItem(s,opts)).join('')}</div>`;
  }
  document.querySelectorAll('.bookmark-btn').forEach(btn=>{
    btn.onclick = e=>{ e.stopPropagation(); btn.classList.toggle('on'); };
  });
}

/* ============ MAIN RENDER ============ */
function getFilteredLibrary(){
  if(currentFilter==='progress') return LIBRARY.filter(s=>s.status==='progress');
  if(currentFilter==='finished') return LIBRARY.filter(s=>s.status==='finished');
  if(currentFilter==='unread') return LIBRARY.filter(s=>s.status==='unread');
  return LIBRARY;
}

function renderLibrary(){
  const filtered = getFilteredLibrary();
  const totalPages = Math.max(1, Math.ceil(filtered.length / LIB_PAGE_SIZE));
  if(libPage > totalPages) libPage = totalPages;
  if(libPage < 1) libPage = 1;
  const start = (libPage - 1) * LIB_PAGE_SIZE;
  const pageItems = filtered.slice(start, start + LIB_PAGE_SIZE);
  renderItems(pageItems, currentView.reading, 'lib-container');
  renderLibPagination(totalPages);
}

function renderLibPagination(totalPages){
  const el = document.getElementById('lib-pagination');
  if(totalPages <= 1){ el.innerHTML = ''; return; }
  let html = `<button class="page-btn nav ${libPage===1?'disabled':''}" data-page="prev">${icon('chevronLeft',{size:14})}</button>`;
  for(let i=1;i<=totalPages;i++){
    html += `<button class="page-btn ${i===libPage?'active':''}" data-page="${i}">${i}</button>`;
  }
  html += `<button class="page-btn nav ${libPage===totalPages?'disabled':''}" data-page="next">${icon('chevronRight',{size:14})}</button>`;
  el.innerHTML = html;
}

function renderSaved(){
  document.getElementById('saved-count').textContent = SAVED.length + ' stories';
  renderItems(SAVED, currentView.saved, 'saved-container', {bookmarked:true});
}
function renderHistory(){
  renderItems(HISTORY, currentView.history, 'history-container');
}

function renderHeader(){
  document.getElementById('search-btn').innerHTML = icon('search',{size:18});
  document.getElementById('bell-btn').innerHTML = icon('bell',{size:19}) + '<span class="badge-dot"></span>';
  document.getElementById('gift-btn').innerHTML = icon('gift',{size:19});
}

  document.getElementById('empty-ic').innerHTML = icon('download',{size:28});
  document.getElementById('empty-btn').innerHTML = icon('compass',{size:14,color:'#fff'}) + ' Browse Stories';
}
function renderContinue(){
  document.getElementById('continue-row').innerHTML = CONTINUE.map(contCard).join('');
}
function renderViewToggleIcons(){
  document.getElementById('btn-list').innerHTML = icon('list',{size:15});
  document.getElementById('btn-grid').innerHTML = icon('grid',{size:15});
  document.querySelectorAll('#saved-toggle .view-btn, #history-toggle .view-btn').forEach(btn=>{
    btn.innerHTML = icon(btn.dataset.view==='list'?'list':'grid',{size:15});
  });
}

/* ============ PROMO SLIDER ============ */
let promoIndex = 0;
let promoTimer = null;

function renderPromo(){
  const slides = PROMO.slice(0, 5);
  document.getElementById('promo-track').innerHTML = slides.map(s => `
    <div class="promo-slide" style="background-image:url('${s.img}')">
      <div class="promo-scrim"></div>
      <div class="promo-text">
        <div class="promo-eyebrow">Promoted</div>
        <div class="promo-title">${s.title}</div>
        <div class="promo-author">by ${s.author}</div>
      </div>
      <div class="promo-cta">${s.cta}</div>
    </div>
  `).join('');
  document.getElementById('promo-dots').innerHTML = slides.map((_,i) =>
    `<div class="promo-dot${i===0?' on':''}"></div>`
  ).join('');
}

function goToPromoSlide(i){
  const slides = document.querySelectorAll('.promo-slide');
  if(!slides.length) return;
  promoIndex = (i + slides.length) % slides.length;
  document.getElementById('promo-track').style.transform = `translateX(-${promoIndex * 100}%)`;
  document.querySelectorAll('.promo-dot').forEach((d,idx)=> d.classList.toggle('on', idx===promoIndex));
}

function startPromoAutoplay(){
  stopPromoAutoplay();
  promoTimer = setInterval(()=> goToPromoSlide(promoIndex + 1), 3200);
}
function stopPromoAutoplay(){
  if(promoTimer) clearInterval(promoTimer);
}

function initPromoSlider(){
  renderPromo();
  goToPromoSlide(0);
  startPromoAutoplay();

  const slider = document.getElementById('promo-slider');
  slider.addEventListener('touchstart', stopPromoAutoplay, {passive:true});
  slider.addEventListener('touchend', startPromoAutoplay, {passive:true});
  slider.addEventListener('mouseenter', stopPromoAutoplay);
  slider.addEventListener('mouseleave', startPromoAutoplay);

  let startX = 0, deltaX = 0, dragging = false;
  slider.addEventListener('touchstart', e=>{ dragging = true; startX = e.touches[0].clientX; }, {passive:true});
  slider.addEventListener('touchmove', e=>{ if(dragging) deltaX = e.touches[0].clientX - startX; }, {passive:true});
  slider.addEventListener('touchend', ()=>{
    if(Math.abs(deltaX) > 40){ goToPromoSlide(promoIndex + (deltaX < 0 ? 1 : -1)); }
    dragging = false; deltaX = 0;
  });
}

/* ============ EVENTS ============ */
function initTabs(){
  document.querySelectorAll('#main-tabs .tab').forEach(t=>{
    t.addEventListener('click',()=>{
      document.querySelectorAll('#main-tabs .tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      document.getElementById('panel-'+t.dataset.panel).classList.add('active');
    });
  });
}
function initFilters(){
  document.querySelectorAll('#filter-row .filter-chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      document.querySelectorAll('#filter-row .filter-chip').forEach(x=>x.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      libPage = 1;
      renderLibrary();
    });
  });
}
function initViewToggles(){
  document.querySelectorAll('#view-toggle .view-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('#view-toggle .view-btn').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      currentView.reading = btn.dataset.view;
      libPage = 1;
      renderLibrary();
    });
  });
  document.querySelectorAll('#saved-toggle .view-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('#saved-toggle .view-btn').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      currentView.saved = btn.dataset.view;
      renderSaved();
    });
  });
  document.querySelectorAll('#history-toggle .view-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('#history-toggle .view-btn').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      currentView.history = btn.dataset.view;
      renderHistory();
    });
  });
}
function initPagination(){
  document.getElementById('lib-pagination').addEventListener('click', e=>{
    const btn = e.target.closest('.page-btn');
    if(!btn || btn.classList.contains('disabled')) return;
    const p = btn.dataset.page;
    const filtered = getFilteredLibrary();
    const totalPages = Math.max(1, Math.ceil(filtered.length / LIB_PAGE_SIZE));
    if(p==='prev'){ if(libPage>1) libPage--; }
    else if(p==='next'){ if(libPage<totalPages) libPage++; }
    else { libPage = parseInt(p,10); }
    renderLibrary();
  });
}

/* ============ BOOT ============ */
renderHeader();
renderQuickIcons();
renderContinue();
renderViewToggleIcons();
initPromoSlider();
renderLibrary();
renderSaved();
renderHistory();
initTabs();
initFilters();
initViewToggles();
initPagination();
</script>
