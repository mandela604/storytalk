        <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:600;color:${p.liked?'var(--acc)':'#555'};cursor:pointer;padding:6px 0" id="afclike-${p.id}" onclick="toggleAskLike('${p.id}',this)"><i class="${p.liked?"fas":"far"} fa-heart"></i> ${fmtN(p.likes)}</div>
        <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:600;color:#555;cursor:pointer;padding:6px 0" onclick="switchTab('ask')"><i class="far fa-comment"></i> Reply</div>
        <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:600;color:#555;cursor:pointer;padding:6px 0" onclick="openShareModal({title:'Ask: ${p.q.substring(0,40).replace(/'/g,"\\'").replace(/"/g,'\\"')}…',sub:'on Droboard',img:'',url:'https://droboard.app/ask/${p.id}'})"><i class="fas fa-share-alt"></i></div>
        <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:600;color:#555;cursor:pointer;padding:6px 0" onclick="toast('🔖 Saved!')"><i class="far fa-bookmark"></i></div>
      </div>
    </div>
  </div>`;
}
function toggleAskLike(id,el){
  const p=ASK_SEED.find(x=>x.id===id);if(!p)return;
  p.liked=!p.liked;p.likes+=p.liked?1:-1;
  el.style.color=p.liked?'var(--acc)':'#555';
  el.innerHTML=`<i class="${p.liked?"fas":"far"} fa-heart"></i> ${fmtN(p.likes)}`;
}

// AVATAR (custom rings, opens via DroboardStatusViewer)
function getWRing(wid){const ws=WRITER_STATUS[wid];if(!ws||!ws.hasStatus)return"none";return ws.viewed?"viewed":"new";}
function renderWAvatar(wid,url){
  const cls=getWRing(wid);const has=WRITER_STATUS[wid]?.hasStatus;const oc=has?`onclick="window.openStatusViewer(peopleFromWriterStatus(),'${wid}')"`:"";
  return`<div class="w-av-wrap" ${oc}><div class="w-av-ring ${cls}"><div class="w-av-inner"><img src="${url}" loading="lazy"/></div></div></div>`;
}

// REACTION POPUP (card-level, custom, unchanged)
function buildRxPop(sid){const rx=getRx(sid);return`<div class="rx-pop" id="rxpop-${sid}">${REACTIONS.map(r=>`<div class="rx-btn${rx.userRx===r.id?" reacted":""}" data-sid="${sid}" data-rid="${r.id}"><span class="rx-em">${r.emoji}</span><span class="rx-ct">${fmtN(rx[r.id])}</span></div>`).join("")}</div>`;}
function hideAllRxPops(){document.querySelectorAll(".rx-pop").forEach(p=>p.classList.remove("show"));}

// FEED EVENTS
function attachFeedEvents(){
  const feed=document.getElementById("feed");
  feed.querySelectorAll(".follow-btn").forEach(btn=>{btn.addEventListener("click",e=>{e.stopPropagation();const s=findStory(+btn.dataset.id);if(!s)return;s.writer.isFollowed=!s.writer.isFollowed;toast(s.writer.isFollowed?`Following @${s.writer.name}`:`Unfollowed @${s.writer.name}`);btn.textContent=s.writer.isFollowed?"✓ Following":"+ Follow";btn.classList.toggle("on",s.writer.isFollowed);});});
  feed.querySelectorAll(".act-like").forEach(el=>{
    const id=+el.dataset.id;let ht=null;
    el.addEventListener("pointerdown",e=>{e.stopPropagation();ht=setTimeout(()=>{const p=document.getElementById(`rxpop-${id}`);if(p)p.classList.add("show");},380);},{passive:true});
    el.addEventListener("pointerup",()=>clearTimeout(ht));
    el.addEventListener("pointercancel",()=>clearTimeout(ht));
    el.addEventListener("click",e=>{
      const btn=e.target.closest(".rx-btn");
      if(btn){e.stopPropagation();const rid=btn.dataset.rid,rx=getRx(id);if(rx.userRx===rid){rx[rid]--;rx.userRx=null;btn.classList.remove("reacted");}else{if(rx.userRx)rx[rx.userRx]--;rx[rid]++;rx.userRx=rid;btn.classList.add("reacted");}const ct=btn.querySelector(".rx-ct");if(ct)ct.textContent=fmtN(rx[rid]);toast(`${REACTIONS.find(r=>r.id===rid)?.emoji}`);const p=document.getElementById(`rxpop-${id}`);if(p)p.classList.remove("show");return;}
      e.stopPropagation();const pop=document.getElementById(`rxpop-${id}`);if(pop&&pop.classList.contains("show")){pop.classList.remove("show");return;}
      const s=findStory(id);if(!s)return;s.liked=!s.liked;s.stats.likes+=s.liked?1:-1;refreshActs(id);
    });
  });
  feed.querySelectorAll(".act-save").forEach(el=>{el.addEventListener("click",e=>{e.stopPropagation();const s=findStory(+el.dataset.id);if(!s)return;s.saved=!s.saved;toast(s.saved?"📌 Saved":"Removed");refreshActs(s.id);});});
  feed.querySelectorAll(".act-cmt").forEach(el=>{el.addEventListener("click",e=>{e.stopPropagation();const s=findStory(+el.dataset.id);if(s)openCommentsSheet('story',s.id,(d)=>{s.stats.comments+=d;refreshActs(s.id);});});});
  feed.querySelectorAll(".act-share").forEach(el=>{el.addEventListener("click",e=>{e.stopPropagation();const s=findStory(+el.dataset.id);if(s)openShareModal({title:s.title,sub:`by @${s.writer.name} · ${fmtN(s.stats.likes)} likes`,img:s.cover,url:`https://droboard.app/story/${s.id}`});});});
  feed.querySelectorAll(".s-card").forEach(card=>{card.addEventListener("click",e=>{if(e.target.closest(".act")||e.target.closest(".follow-btn")||e.target.closest(".w-av-wrap")||e.target.closest(".w-name")||e.target.closest(".rx-pop")||e.target.closest(".debate-live"))return;hideAllRxPops();const s=findStory(+card.dataset.id);if(s)DroboardReader.open(s);});});
  feed.querySelectorAll(".qi").forEach(el=>{el.addEventListener("click",e=>{if(e.target.closest(".qi-act")||e.target.closest(".qi-btn"))return;const s=findStory(+el.dataset.id);if(s)DroboardReader.open(s);});});
  feed.querySelectorAll(".qi-btn").forEach(el=>{el.addEventListener("click",e=>{e.stopPropagation();const s=findStory(+el.dataset.id);if(s)DroboardReader.open(s);});});
  feed.querySelectorAll(".qi-like").forEach(el=>{el.addEventListener("click",e=>{e.stopPropagation();const s=findStory(+el.dataset.id);if(!s)return;s.liked=!s.liked;s.stats.likes+=s.liked?1:-1;el.classList.toggle("liked",s.liked);const i=el.querySelector("i");if(i)i.className=s.liked?"fas fa-heart":"far fa-heart";const lbl=el.querySelector(".qi-lbl");if(lbl)lbl.textContent=fmtN(s.stats.likes);});});
  feed.querySelectorAll(".qi-cmt").forEach(el=>{el.addEventListener("click",e=>{e.stopPropagation();const s=findStory(+el.dataset.id);if(s)openCommentsSheet('story',s.id,(d)=>{s.stats.comments+=d;refreshActs(s.id);});});});
  feed.addEventListener("click",e=>{if(!e.target.closest(".act-like")&&!e.target.closest(".rx-pop"))hideAllRxPops();},{passive:true});
}

function refreshActs(id){const s=findStory(id);if(!s)return;document.querySelectorAll(`.act-like[data-id="${id}"]`).forEach(el=>{el.classList.toggle("liked",s.liked);const i=el.querySelector("i");if(i)i.className=s.liked?"fas fa-heart":"far fa-heart";const lbl=el.querySelector(".act-lbl");if(lbl)lbl.textContent=fmtN(s.stats.likes);});document.querySelectorAll(`.act-save[data-id="${id}"]`).forEach(el=>{el.classList.toggle("saved",s.saved);const i=el.querySelector("i");if(i)i.className=s.saved?"fas fa-bookmark":"far fa-bookmark";const lbl=el.querySelector(".act-lbl");if(lbl)lbl.textContent=s.saved?"Saved":"Save";});document.querySelectorAll(`.act-cmt[data-id="${id}"] .act-lbl`).forEach(lbl=>{lbl.textContent=fmtN(s.stats.comments);});}

function openReaderDebate(sid){const s=findStory(sid);if(s)DroboardReader.open(s,{jumpTo:'debate'});}

/* ═══════════════════════════════════════════════════════════
   READER — fully delegated to DroboardReader
   ═══════════════════════════════════════════════════════════ */
DroboardReader.attach({
  ads: IN_ADS,
  onLike(story, rid){
    const wasLiked = story.liked;
    story.liked = !!rid;
    if (story.liked && !wasLiked) story.stats.likes++;
    else if (!story.liked && wasLiked) story.stats.likes--;
    refreshActs(story.id);
  },
  onPollVote(story, oi){ /* engagement mutated internally on story.engagement */ },
  onDebateVote(story, side){ /* engagement mutated internally on story.engagement */ },
  onDebateComment(story, text, side){ /* stored internally on story.engagement.debate.comments */ },
  onNotifyNext(story){ },
  getStoryUrl(story){ return `https://droboard.app/story/${story.id}`; },
  onReadFull(story){ location.href='bridge.html'; },
});

/* ═══════════════════════════════════════════════════════════
   ASK TAB (fully custom, unchanged)
   ═══════════════════════════════════════════════════════════ */
function renderAskList(){const filtered=askFilter==="all"?askPosts:askPosts.filter(p=>p.cat===askFilter);document.getElementById("askList").innerHTML=filtered.map(p=>{const av=p.anon||!p.avatar?`<div class="ask-item-av">${p.anon?"👤":p.name[0]}</div>`:`<div class="ask-item-av"><img src="${p.avatar}" loading="lazy"/></div>`;let poll="";if(p.hasPoll){const tot=p.pollOpts.reduce((s,o)=>s+o.votes,0)||1;poll=`<div class="ask-item-poll">`+p.pollOpts.map((o,i)=>`<div class="ask-item-opt${p.pollVoted===i?" voted":""}" data-qid="${p.id}" data-oi="${i}"><div class="ask-item-bar" style="width:${Math.round(o.votes/tot*100)}%"></div><div class="ask-item-opt-row"><span>${o.text}</span><span class="ask-item-pct">${Math.round(o.votes/tot*100)}%</span></div></div>`).join("")+`</div>`;}const cArea=p.open?renderAskCms(p):"";return`<div class="ask-item" data-qid="${p.id}"><div class="ask-item-body"><div class="ask-item-top">${av}<div style="flex:1"><div class="ask-item-nm">${p.anon?"Anonymous":p.name}</div><div class="ask-item-time">${p.time}</div></div><span class="ask-item-cat">${p.cat}</span></div><div class="ask-item-q">${p.q}</div>${poll}</div>
    <div class="ask-item-acts">
      <div class="ask-item-act${p.liked?" liked":""} ask-like" data-qid="${p.id}"><i class="${p.liked?"fas":"far"} fa-heart"></i> ${fmtN(p.likes)}</div>
      <div class="ask-item-act ask-cmt" data-qid="${p.id}"><i class="far fa-comment"></i> ${p.comments.length}</div>
      <div class="ask-item-act" onclick="openShareModal({title:'Ask: ${p.q.substring(0,40).replace(/'/g,"\\'").replace(/"/g,'\\"')}',sub:'Droboard Ask',img:'',url:'https://droboard.app/ask/${p.id}'})"><i class="fas fa-share-alt"></i></div>
      <div class="ask-item-act" onclick="toast('🔖 Saved!')"><i class="far fa-bookmark"></i></div>
    </div>
    <div class="ask-cm-area${p.open?" open":""}" id="askcma-${p.id}">${cArea}</div></div>`;}).join("");attachAskEv();}
function renderAskCms(p){return`<div class="ask-cm-inp-row"><div class="ask-cm-av">Y</div><input class="ask-cm-inp" id="askinp-${p.id}" placeholder="Write a reply…"/><button class="ask-cm-send" id="asksend-${p.id}" disabled><i class="fas fa-paper-plane"></i></button></div><div class="ask-cm-list">${p.comments.map(c=>`<div class="ask-cm-item"><div class="ask-cm-av">${c.anon?"👤":c.name[0]}</div><div class="ask-cm-body"><div class="ask-cm-name">${c.anon?"Anonymous":c.name}</div><div class="ask-cm-text">${c.text}</div></div></div>`).join("")}</div>`;}
function attachAskEv(){
  document.querySelectorAll(".ask-cat-btn").forEach(el=>{el.addEventListener("click",()=>{askFilter=el.dataset.cat;document.querySelectorAll(".ask-cat-btn").forEach(x=>x.classList.toggle("on",x===el));renderAskList();});});
  document.querySelectorAll(".ask-like").forEach(btn=>{btn.addEventListener("click",e=>{e.stopPropagation();const p=askPosts.find(x=>x.id===btn.dataset.qid);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;renderAskList();});});
  document.querySelectorAll(".ask-cmt").forEach(btn=>{btn.addEventListener("click",e=>{e.stopPropagation();const p=askPosts.find(x=>x.id===btn.dataset.qid);if(!p)return;p.open=!p.open;renderAskList();setTimeout(()=>{const inp=document.getElementById("askinp-"+p.id);const send=document.getElementById("asksend-"+p.id);if(inp&&send){inp.oninput=()=>{send.disabled=inp.value.trim().length===0;};send.onclick=()=>{const t=inp.value.trim();if(!t)return;p.comments.push({id:"ac_"+Date.now(),name:"You",anon:false,text:t});renderAskList();toast("💬 Reply posted!");};}},50);});});
  document.querySelectorAll(".ask-item-opt[data-qid]").forEach(el=>{el.addEventListener("click",e=>{e.stopPropagation();const p=askPosts.find(x=>x.id===el.dataset.qid);if(!p||p.pollVoted>=0)return;const oi=+el.dataset.oi;p.pollOpts[oi].votes++;p.pollVoted=oi;renderAskList();toast("✅ Voted!");});});
}
document.getElementById("askPostBtn").addEventListener("click",()=>{const text=document.getElementById("askTa").value.trim();if(!text){toast("✍️ Write something first!");return;}const anon=document.getElementById("anonChk").checked;const cat=document.getElementById("askCatSel").value;askPosts.unshift({id:"q_"+Date.now(),anon,name:anon?"Anonymous":"You",avatar:anon?null:"https://i.pravatar.cc/100?img=1",cat,q:text,time:"Just now",likes:0,liked:false,comments:[],hasPoll:false,pollVoted:-1,open:false});document.getElementById("askTa").value="";renderAskList();toast("✅ Posted!");});

// INIT
initWebSocket();
renderFeed();
</script>
