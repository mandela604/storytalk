<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Droboard · Share Modal Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
/* ── Reset & base ───────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --acc:  #ff0050;
  --acc2: #ff4d7a;
  --glow: rgba(255,0,80,.3);
  --dark: #000;
  --card: #0a0a0a;
  --bd:   rgba(255,255,255,.08);
  --tx:   #f0f0f0;
  --muted:#555;
}
html, body {
  min-height: 100%;
  background: var(--dark);
  color: var(--tx);
  font-family: 'DM Sans', sans-serif;
}

/* ── Page chrome ────────────────────────────────── */
.page-header {
  padding: 28px 20px 0;
  text-align: center;
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 900;
  color: var(--acc);
  letter-spacing: -1.5px;
}
.page-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}
.page-desc {
  font-size: 12px;
  color: #333;
  margin-top: 10px;
  line-height: 1.6;
  max-width: 340px;
  margin-left: auto;
  margin-right: auto;
}
.page-desc code {
  font-size: 11px;
  background: rgba(255,0,80,.1);
  color: var(--acc2);
  border-radius: 5px;
  padding: 1px 5px;
  font-family: 'Courier New', monospace;
}

/* ── Card grid ─────────────────────────────────── */
.cards {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 24px 0 100px;
  max-width: 480px;
  margin: 0 auto;
}

/* ── Story card ─────────────────────────────────── */
.story-card {
  position: relative;
  width: 100%;
  aspect-ratio: 4/5;
  overflow: hidden;
  background-size: cover;
  background-position: center 30%;
  cursor: pointer;
}
.story-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg,
    rgba(0,0,0,.97) 0%,
    rgba(0,0,0,.5)  42%,
    rgba(0,0,0,.1)  70%,
    rgba(0,0,0,.35) 100%
  );
}
.story-card-body {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0 64px 28px 18px;
}
.card-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--acc);
  padding: 3px 10px;
  border-radius: 14px;
  font-size: 9px;
  font-weight: 800;
  margin-bottom: 7px;
  align-self: flex-start;
}
.card-type {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.15);
  color: #d0c0ff;
  padding: 3px 10px;
  border-radius: 14px;
  font-size: 9px;
  font-weight: 600;
  margin-left: 4px;
}
.card-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 900;
  line-height: 1.2;
  color: #fff;
  text-shadow: 0 2px 18px rgba(0,0,0,.9);
  margin-bottom: 7px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-preview {
  font-size: 12px;
  color: rgba(255,255,255,.65);
  line-height: 1.5;
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-writer-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-av {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  object-fit: cover;
  border: 1.5px solid rgba(255,0,80,.45);
  flex-shrink: 0;
}
.card-writer-name {
  font-size: 11px;
  font-weight: 700;
  flex: 1;
  color: #e0e0e0;
}
.card-stats {
  font-size: 10px;
  color: #555;
  display: flex;
  gap: 8px;
}
.card-stats span { display: flex; align-items: center; gap: 3px; }

/* ── Action bar (right side) ───────────────────── */
.card-acts {
  position: absolute;
  right: 10px;
  bottom: 28px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.ca {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  user-select: none;
}
.ca-ico {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  transition: .15s;
  color: #ccc;
}
.ca:active .ca-ico { transform: scale(.88); }
.ca-lbl { font-size: 9px; font-weight: 600; color: #aaa; }
.ca.liked .ca-ico { background: rgba(255,0,80,.22); border-color: rgba(255,0,80,.4); }
.ca.liked i { color: var(--acc); }
.ca.saved .ca-ico { background: rgba(100,200,255,.12); border-color: rgba(100,200,255,.3); }
.ca.saved i { color: #7dd3fc; }
/* Share button — highlighted */
.ca.share-btn .ca-ico {
  background: rgba(255,0,80,.18);
  border-color: rgba(255,0,80,.35);
}
.ca.share-btn i { color: var(--acc2); }
.ca.share-btn .ca-lbl { color: var(--acc2); font-weight: 800; }

/* ── Divider between cards ─────────────────────── */
.card-divider {
  height: 4px;
  background: linear-gradient(90deg, transparent, rgba(255,0,80,.15), transparent);
}

/* ── Event log ──────────────────────────────────── */
.event-log {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 448px;
  background: rgba(10,10,10,.96);
  border: 1px solid rgba(255,0,80,.2);
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 11px;
  z-index: 8999;
  pointer-events: none;
}
.event-log-label {
  font-size: 9px;
  font-weight: 800;
  color: var(--acc);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 5px;
}
.event-log-row {
  color: #555;
  line-height: 1.5;
  font-family: 'Courier New', monospace;
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.event-log-row.new { color: #10b981; animation: fadeLog .4s ease; }
@keyframes fadeLog { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<div class="page-header">
  <div class="logo">Droboard</div>
  <div class="page-label">Share Modal · Live Demo</div>
  <div class="page-desc">
    Tap the <code>Share</code> button on any card below.<br/>
    The modal is loaded via <code>initShareModal()</code> + <code>openShareModal()</code>.
  </div>
</div>

<!-- ── Three demo cards ───────────────────────── -->
<div class="cards" id="cards"></div>

<!-- ── Event log ─────────────────────────────── -->
<div class="event-log" id="eventLog">
  <div class="event-log-label">📡 droboard:share events</div>
  <div class="event-log-row" id="logRow">Waiting for share action…</div>
</div>

<script type="module">

/* ════════════════════════════════════════════════════════
   In a real project this would be:
   import { initShareModal, openShareModal } from './shareModal.js';

   For this self-contained demo we inline the module below.
   ════════════════════════════════════════════════════════ */

// ─────────────────────────────────────────────────────────
// shareModal.js — inlined
// ─────────────────────────────────────────────────────────
const STYLES = `
:root {
  --sm-acc:   #ff0050;
  --sm-acc2:  #ff4d7a;
  --sm-glow:  rgba(255,0,80,.28);
  --sm-bd:    rgba(255,255,255,.08);
  --sm-dark:  #080808;
  --sm-tx:    #f0f0f0;
  --sm-muted: #666;
}
#dro-share-bg {
  position:fixed; inset:0; z-index:9000;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  display:none; align-items:flex-end; justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
#dro-share-bg.dro-open { display:flex; }
#dro-share-sheet {
  width:100%; max-width:480px;
  background:var(--sm-dark);
  border-radius:20px 20px 0 0;
  overflow:hidden;
  animation:droSheetUp .28s cubic-bezier(.32,1.1,.64,1) both;
  padding-bottom:max(20px,env(safe-area-inset-bottom));
  font-family:'DM Sans',system-ui,sans-serif;
  color:var(--sm-tx);
}
@keyframes droSheetUp {
  from { transform:translateY(100%); opacity:0; }
  to   { transform:translateY(0);    opacity:1; }
}
.dro-sm-handle {
  width:36px; height:4px;
  background:rgba(255,255,255,.12);
  border-radius:4px; margin:12px auto 0;
}
.dro-sm-hdr {
  display:flex; align-items:center;
  justify-content:space-between; padding:10px 16px 8px;
}
.dro-sm-hdr h3 {
  font-size:14px; font-weight:800; color:var(--sm-tx);
  display:flex; align-items:center; gap:6px;
}
.dro-sm-close {
  width:28px; height:28px; border-radius:50%;
  background:rgba(255,255,255,.07); border:1px solid var(--sm-bd);
  color:var(--sm-muted); font-size:12px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:.18s;
}
.dro-sm-close:hover { background:rgba(255,0,80,.15); color:var(--sm-acc); }
.dro-sm-prev {
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.04);
  border-radius:12px; padding:10px 12px; margin:0 14px 12px;
}
.dro-sm-prev-img {
  width:44px; height:44px; border-radius:9px;
  background-size:cover; background-position:center;
  flex-shrink:0; background-color:rgba(255,0,80,.1);
}
.dro-sm-prev-t { font-size:12px; font-weight:700; color:#e0e0e0; line-height:1.3; margin-bottom:2px; }
.dro-sm-prev-s { font-size:10px; color:#444; }
.dro-sm-post-row { display:flex; gap:8px; padding:0 14px 12px; }
.dro-sm-post {
  flex:1; padding:10px 8px; border-radius:13px;
  font-size:11px; font-weight:700; cursor:pointer;
  border:none; font-family:inherit;
  display:flex; flex-direction:column; align-items:center;
  gap:5px; color:#fff; transition:.15s;
}
.dro-sm-post:active { transform:scale(.95); opacity:.85; }
.dro-sm-post i { font-size:15px; }
.dro-sm-post.status { background:linear-gradient(135deg,#0044ff,#00aaff); }
.dro-sm-post.profile { background:rgba(255,0,80,.18); border:1px solid rgba(255,0,80,.25); }
.dro-sm-link-row {
  display:flex; align-items:center; gap:7px;
  background:rgba(255,255,255,.05); border:1px solid var(--sm-bd);
  border-radius:10px; padding:8px 11px; margin:0 14px 12px;
}
.dro-sm-link-row input {
  flex:1; background:transparent; border:none;
  color:#666; font-size:11px; outline:none; font-family:inherit;
}
.dro-sm-copy-btn {
  background:var(--sm-acc); color:#fff; border:none;
  padding:5px 12px; border-radius:7px; font-size:11px; font-weight:700;
  cursor:pointer; font-family:inherit; transition:.15s; flex-shrink:0;
}
.dro-sm-copy-btn:active { opacity:.8; transform:scale(.96); }
.dro-sm-copy-btn.copied { background:#10b981; }
.dro-sm-icons {
  display:flex; gap:10px; flex-wrap:wrap;
  justify-content:center; padding:0 14px 6px;
}
.dro-sh-ico {
  display:flex; flex-direction:column; align-items:center;
  gap:4px; cursor:pointer; transition:.15s;
  -webkit-tap-highlight-color:transparent;
}
.dro-sh-ico:active { transform:scale(.88); }
.dro-sh-ico-bg {
  width:44px; height:44px; border-radius:13px;
  display:flex; align-items:center; justify-content:center;
  font-size:19px; transition:.15s;
}
.dro-sh-ico:hover .dro-sh-ico-bg { filter:brightness(1.15); }
.dro-sh-ico span { font-size:9px; font-weight:600; color:var(--sm-muted); }
.dro-sm-copy-msg {
  text-align:center; font-size:11px; font-weight:600;
  color:#10b981; height:18px; padding-bottom:10px; transition:opacity .25s;
}
`;

const HTML = `
<div id="dro-share-bg">
  <div id="dro-share-sheet">
    <div class="dro-sm-handle"></div>
    <div class="dro-sm-hdr">
      <h3>Share <span id="dro-share-type-lbl" style="color:#666;font-weight:400;font-size:11px"></span></h3>
      <button class="dro-sm-close" id="dro-sm-close" aria-label="Close">✕</button>
    </div>
    <div class="dro-sm-prev" id="dro-share-prev"></div>
    <div class="dro-sm-post-row">
      <button class="dro-sm-post status" id="dro-post-status">
        <i class="fas fa-circle-notch"></i>Post to Status
      </button>
      <button class="dro-sm-post profile" id="dro-post-profile">
        <i class="fas fa-user-circle"></i>Post to Profile
      </button>
    </div>
    <div class="dro-sm-link-row">
      <input type="text" id="dro-share-link" readonly aria-label="Share link"/>
      <button class="dro-sm-copy-btn" id="dro-copy-link-btn">Copy</button>
    </div>
    <div class="dro-sm-icons">
      <div class="dro-sh-ico" data-platform="whatsapp">
        <div class="dro-sh-ico-bg" style="background:#1ebe57"><i class="fab fa-whatsapp" style="color:#fff"></i></div>
        <span>WhatsApp</span>
      </div>
      <div class="dro-sh-ico" data-platform="twitter">
        <div class="dro-sh-ico-bg" style="background:#000;border:1px solid #222"><i class="fab fa-x-twitter" style="color:#fff;font-size:17px"></i></div>
        <span>X (Twitter)</span>
      </div>
      <div class="dro-sh-ico" data-platform="instagram">
        <div class="dro-sh-ico-bg" style="background:linear-gradient(135deg,#f09433,#dc2743,#bc1888)"><i class="fab fa-instagram" style="color:#fff"></i></div>
        <span>Instagram</span>
      </div>
      <div class="dro-sh-ico" data-platform="telegram">
        <div class="dro-sh-ico-bg" style="background:#0088cc"><i class="fab fa-telegram" style="color:#fff"></i></div>
        <span>Telegram</span>
      </div>
      <div class="dro-sh-ico" data-platform="facebook">
        <div class="dro-sh-ico-bg" style="background:#1877f2"><i class="fab fa-facebook" style="color:#fff"></i></div>
        <span>Facebook</span>
      </div>
      <div class="dro-sh-ico" data-platform="copy">
        <div class="dro-sh-ico-bg" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)"><i class="fas fa-link" style="color:#aaa;font-size:16px"></i></div>
        <span>Copy Link</span>
      </div>
    </div>
    <div class="dro-sm-copy-msg" id="dro-copy-msg"></div>
  </div>
</div>
`;

let _data = {};
let _initialized = false;

function _toast(msg) {
  if (typeof window.toast === 'function') { window.toast(msg); return; }
  let el = document.getElementById('_dro_fb_toast');
  if (!el) {
    el = Object.assign(document.createElement('div'), { id: '_dro_fb_toast' });
    el.style.cssText = `position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);background:#111;border:1px solid rgba(255,255,255,.08);color:#e0e0e0;padding:8px 18px;border-radius:24px;font-size:12px;font-weight:600;z-index:99999;opacity:0;transition:.28s;pointer-events:none;white-space:nowrap;font-family:'DM Sans',system-ui,sans-serif;`;
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1'; el.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(16px)'; }, 2400);
}

function _copyToClipboard(text) {
  return navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject();
}

function _showCopyConfirm(msg = '✅ Copied!') {
  const el = document.getElementById('dro-copy-msg');
  if (!el) return;
  el.textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent = ''; }, 2200);
}

function _dispatch(platform, data) {
  document.dispatchEvent(new CustomEvent('droboard:share', { detail: { platform, ...data } }));
}

const PLATFORM_ACTIONS = {
  whatsapp(d) { window.open(`https://wa.me/?text=${encodeURIComponent(`📖 "${d.title}"\n\n${d.sub}\nRead on Droboard: ${d.url}`)}`, '_blank'); },
  twitter(d)  { window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(`📖 "${d.title}" — ${d.sub}`)}&url=${encodeURIComponent(d.url)}`, '_blank'); },
  instagram(d){ _copyToClipboard(`📖 "${d.title}"\n${d.sub}\n${d.url}`).catch(()=>{}); _showCopyConfirm('📋 Caption copied for Instagram!'); _toast('📋 Caption copied — paste into Instagram'); },
  telegram(d) { window.open(`https://t.me/share/url?url=${encodeURIComponent(d.url)}&text=${encodeURIComponent(`📖 "${d.title}"`)}`, '_blank'); },
  facebook(d) { window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(d.url)}`, '_blank'); },
  copy(d)     { _copyToClipboard(d.url).catch(()=>{}); _showCopyConfirm('✅ Link copied!'); _toast('🔗 Link copied!'); },
};

function initShareModal() {
  if (_initialized) return;
  _initialized = true;
  const style = document.createElement('style');
  style.textContent = STYLES;
  document.head.appendChild(style);
  const wrap = document.createElement('div');
  wrap.innerHTML = HTML.trim();
  document.body.appendChild(wrap.firstElementChild);

  const bg    = document.getElementById('dro-share-bg');
  const sheet = document.getElementById('dro-share-sheet');
  const copyB = document.getElementById('dro-copy-link-btn');

  bg.addEventListener('click', e => { if (e.target === bg) closeShareModal(); });
  document.getElementById('dro-sm-close').addEventListener('click', closeShareModal);

  copyB.addEventListener('click', () => {
    _copyToClipboard(document.getElementById('dro-share-link').value).catch(()=>{});
    copyB.textContent = '✓ Copied'; copyB.classList.add('copied');
    _showCopyConfirm('✅ Link copied!'); _toast('🔗 Link copied!');
    setTimeout(() => { copyB.textContent = 'Copy'; copyB.classList.remove('copied'); }, 2000);
  });

  document.getElementById('dro-post-status').addEventListener('click', () => {
    _dispatch('status', _data);
    closeShareModal(); _toast('📢 Posted to status!');
  });
  document.getElementById('dro-post-profile').addEventListener('click', () => {
    _dispatch('profile', _data);
    closeShareModal(); _toast('✅ Posted to profile!');
  });

  sheet.addEventListener('click', e => {
    const ico = e.target.closest('.dro-sh-ico[data-platform]');
    if (!ico) return;
    const p = ico.dataset.platform;
    if (PLATFORM_ACTIONS[p]) {
      PLATFORM_ACTIONS[p](_data);
      _dispatch(p, _data);
      if (!['copy','instagram'].includes(p)) closeShareModal();
    }
  });

  let _ty = 0;
  sheet.addEventListener('touchstart', e => { _ty = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchmove',  e => { if (e.touches[0].clientY - _ty > 60) closeShareModal(); }, { passive: true });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && bg.classList.contains('dro-open')) closeShareModal(); });
}

function openShareModal(shareData = {}) {
  if (!_initialized) initShareModal();
  _data = {
    title: shareData.title || 'Droboard Story',
    sub:   shareData.sub   || '',
    img:   shareData.img   || '',
    url:   shareData.url   || 'https://droboard.app',
    type:  shareData.type  || '',
  };
  document.getElementById('dro-share-type-lbl').textContent = _data.type;
  document.getElementById('dro-share-link').value           = _data.url;
  document.getElementById('dro-copy-msg').textContent       = '';
  const cb = document.getElementById('dro-copy-link-btn');
  cb.textContent = 'Copy'; cb.classList.remove('copied');
  document.getElementById('dro-share-prev').innerHTML = `
    <div class="dro-sm-prev-img" style="${_data.img ? `background-image:url('${_data.img}')` : ''}"></div>
    <div>
      <div class="dro-sm-prev-t">${_data.title}</div>
      ${_data.sub ? `<div class="dro-sm-prev-s">${_data.sub}</div>` : ''}
    </div>`;
  document.getElementById('dro-share-bg').classList.add('dro-open');
  document.body.style.overflow = 'hidden';
}

function closeShareModal() {
  const bg = document.getElementById('dro-share-bg');
  if (bg) bg.classList.remove('dro-open');
  document.body.style.overflow = '';
}
// ─── end shareModal.js ───────────────────────────────────────────────────────


// ═══════════════════════════════════════════════════════
// DEMO PAGE CODE
// ═══════════════════════════════════════════════════════

// 1. Init the modal once
initShareModal();

// 2. Three demo story cards
const STORIES = [
  {
    id: 1,
    title: "I came home early and caught my husband kissing my late sister's photograph",
    preview: "My body froze. He held the frame like someone begging forgiveness from a ghost.",
    cat: "💔 Betrayal",
    type: "S2·Ch4",
    typeClass: "series",

function fmtN(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }

function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = STORIES.map((s, i) => `
    <div class="story-card" data-id="${s.id}" style="background-image:url('${s.cover}')">
      <div class="story-card-body">
        <div>
          <span class="card-badge">${s.cat}</span>
          <span class="card-type">${s.type}</span>
        </div>
        <div class="card-title">${s.title}</div>
        <div class="card-preview">${s.preview}</div>
        <div class="card-writer-row">
          <img class="card-av" src="${s.writer.avatar}" loading="lazy" alt=""/>
          <span class="card-writer-name">@${s.writer.name}</span>
          <div class="card-stats">
            <span><i class="far fa-heart"></i> ${fmtN(s.likes)}</span>
            <span><i class="far fa-comment"></i> ${fmtN(s.comments)}</span>
          </div>
        </div>
      </div>
      <div class="card-acts">
        <div class="ca${s.liked ? ' liked' : ''}" data-act="like" data-id="${s.id}">
          <div class="ca-ico"><i class="${s.liked ? 'fas' : 'far'} fa-heart"></i></div>
          <span class="ca-lbl" id="likes-${s.id}">${fmtN(s.likes)}</span>
        </div>
        <div class="ca" data-act="comment" data-id="${s.id}">
          <div class="ca-ico"><i class="far fa-comment"></i></div>
          <span class="ca-lbl">${fmtN(s.comments)}</span>
        </div>
        <div class="ca${s.saved ? ' saved' : ''}" data-act="save" data-id="${s.id}">
          <div class="ca-ico"><i class="${s.saved ? 'fas' : 'far'} fa-bookmark"></i></div>
          <span class="ca-lbl">${s.saved ? 'Saved' : 'Save'}</span>
        </div>
        <!-- Share button calls openShareModal() -->
        <div class="ca share-btn" data-act="share" data-id="${s.id}">
          <div class="ca-ico"><i class="fas fa-share-alt"></i></div>
          <span class="ca-lbl">Share</span>
        </div>
      </div>
    </div>
    ${i < STORIES.length - 1 ? '<div class="card-divider"></div>' : ''}
  `).join('');

  // Wire up action buttons
  container.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    e.stopPropagation();
    const id  = +btn.dataset.id;
    const act = btn.dataset.act;
    const s   = STORIES.find(x => x.id === id);
    if (!s) return;

    if (act === 'like') {
      s.liked = !s.liked;
      s.likes += s.liked ? 1 : -1;
      btn.classList.toggle('liked', s.liked);
      btn.querySelector('i').className = s.liked ? 'fas fa-heart' : 'far fa-heart';
      document.getElementById('likes-' + id).textContent = fmtN(s.likes);
    }

    if (act === 'save') {
      s.saved = !s.saved;
      btn.classList.toggle('saved', s.saved);
      btn.querySelector('i').className = s.saved ? 'fas fa-bookmark' : 'far fa-bookmark';
      btn.querySelector('.ca-lbl').textContent = s.saved ? 'Saved' : 'Save';
    }

    if (act === 'comment') {
      _toast('💬 Comments coming soon!');
    }

    // 3. openShareModal() called here — this is the integration point
    if (act === 'share') {
      openShareModal({
        title: s.title,
        sub:   `by @${s.writer.name} · ${fmtN(s.likes)} likes`,
        img:   s.cover,
        url:   s.url,
        type:  s.typeClass === 'short' ? '✨ Short Story' : '📖 Series',
      });
    }
  });
}

renderCards();

// 4. Listen to the droboard:share event fired by the module
document.addEventListener('droboard:share', e => {
  const { platform, title } = e.detail;
  const row = document.getElementById('logRow');
  row.className = 'event-log-row new';
  row.textContent = `platform="${platform}"  title="${title.slice(0,40)}…"`;
  // Re-trigger animation
  void row.offsetWidth;
  setTimeout(() => row.classList.remove('new'), 600);
});

</script>
