<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#ffffff"/>
<title>Droboard · Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{
  --acc:#ff0050;--acc2:#ff4d7a;--acc3:#ff7a9a;
  --glow:rgba(255,0,80,.22);--glow-sm:rgba(255,0,80,.12);
  --bg:#000000;--l1:#08090c;--l2:#0e0f13;--l3:#13141a;--l4:#1a1b22;
  --card:#000000;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.04);--bd-acc:rgba(255,0,80,.20);
  --tx-high:#e0e0e0;--tx-body:#c0c0c0;--tx-muted:#71717a;--tx-faint:#3f3f46;
  --tx-title:#e0e0e0;
  --blue:#38bdf8;--green:#34d399;--gold:#fbbf24;--purple:#a78bfa;--orange:#fb923c;
  --nav-h:64px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,12px);
}
[data-theme="light"]{
  --bg:#d8d8d8;--l1:#ffffff;--l2:#f1f1f1;--l3:#ffffff;--l4:#e8e8e8;
  --card:#ffffff;
  --bd:rgba(0,0,0,.1);--bd2:rgba(0,0,0,.05);--bd-acc:rgba(255,0,80,.25);
  --tx-high:#161616;--tx-body:#3a3a3a;--tx-muted:#666666;--tx-faint:#8a8a8a;
  --tx-title:#161616;
}
[data-theme="light"] body{background:var(--bg);color:var(--tx-body)}
[data-theme="light"] .top-bar,
[data-theme="light"] .feed-tabs{background:rgba(255,255,255,.97);border-color:var(--bd)}
[data-theme="light"] .top-icon-btn{background:var(--l2);color:#555;border-color:var(--bd)}
[data-theme="light"] .composer-input{background:var(--l2);color:#888}
[data-theme="light"] .composer-shortcuts{border-color:var(--bd)}
[data-theme="light"] .story-add{background:var(--l2)}
[data-theme="dark"] .top-bar,
[data-theme="dark"] .feed-tabs{background:rgba(0,0,0,.97)}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--tx-body);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body{display:flex;justify-content:center;min-height:100vh;transition:background .25s ease,color .25s ease}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.2);border-radius:2px}

.phone{width:100%;max-width:420px;min-height:100vh;background:var(--l1);position:relative;box-shadow:0 0 50px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow-x:hidden;padding-bottom:calc(var(--safe-b) + var(--nav-h) + 16px);transition:background .25s ease}
@media (min-width:421px){ .phone{ box-shadow:0 0 50px rgba(0,0,0,.14) } }

.top-bar{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd)}
.top-logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--acc);letter-spacing:-1px;cursor:pointer}
.top-right{display:flex;align-items:center;gap:8px}
.top-icon-btn{width:36px;height:36px;border-radius:50%;background:var(--l2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:#555;transition:.15s;position:relative;flex-shrink:0}
.top-icon-btn:active{transform:scale(.9)}
.notif-count{position:absolute;top:4px;right:4px;background:var(--acc);color:#fff;font-size:7px;font-weight:800;min-width:14px;height:14px;border-radius:7px;padding:0 3px;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}

.feed-tabs{display:flex;gap:20px;padding:0 14px;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.97);overflow-x:auto;position:sticky;top:57px;z-index:150;backdrop-filter:blur(12px);scrollbar-width:none}
.feed-tabs::-webkit-scrollbar{display:none}
.f-tab{padding:11px 0;font-size:12.5px;font-weight:700;color:var(--tx-faint);white-space:nowrap;position:relative;cursor:pointer}
.f-tab.active{color:var(--acc)}
.f-tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:3px;background:var(--acc)}

.stories-wrap{padding:12px 0;border-bottom:8px solid var(--bg);background:var(--l1)}
.stories{display:flex;gap:13px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:58px;cursor:pointer}
.story-ring{width:56px;height:56px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,var(--acc),var(--purple),var(--orange));position:relative;flex-shrink:0}
.story-ring.own{background:var(--bd)}
.story-ring .inner{width:100%;height:100%;border-radius:50%;background:var(--l1);padding:2px}
.story-avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.story-add{width:100%;height:100%;border-radius:50%;background:var(--l2);display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:20px;font-weight:800}
.story-name{font-size:10px;font-weight:600;color:var(--tx-muted);max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.composer-block{padding:14px;border-bottom:8px solid var(--bg);background:var(--l1)}
.composer-top{display:flex;align-items:center;gap:11px;cursor:pointer}
.composer-av{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0}
.composer-input{flex:1;background:var(--l2);border-radius:22px;padding:11px 16px;font-size:13.5px;color:var(--tx-faint)}
.composer-shortcuts{display:flex;justify-content:space-between;margin-top:13px;padding-top:12px;border-top:1px solid var(--bd)}
.shortcut{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;cursor:pointer;background:none;border:none;font-family:inherit}
.shortcut-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px}
.shortcut span{font-size:10.5px;font-weight:600;color:var(--tx-muted)}
.sc-photo{background:rgba(56,189,248,.1);color:var(--blue)}
.sc-chapter{background:rgba(167,139,250,.1);color:var(--purple)}
.sc-review{background:rgba(251,191,36,.1);color:#b57e00}
.sc-debate{background:rgba(251,146,60,.1);color:#c2610a}

.sk{background:linear-gradient(90deg,var(--l2) 25%,var(--l4) 37%,var(--l2) 63%);background-size:400% 100%;animation:skShimmer 1.4s ease infinite;border-radius:12px}
@keyframes skShimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
#loadingState{padding:14px 16px}
#emptyState{display:none;padding:60px 24px;text-align:center}
.empty-icon{font-size:38px;margin-bottom:10px}
.empty-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:800;color:var(--tx-high);margin-bottom:6px}
.empty-sub{font-size:12.5px;color:var(--tx-muted);line-height:1.5}

/* Ad gutter so sponsored cards match post spacing */
.pc-ad-wrap{border-bottom:8px solid var(--bg)}
.pc-ad-wrap:last-child{border-bottom:none}

.toast{position:fixed;bottom:calc(var(--safe-b) + var(--nav-h) + 14px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--l3);border:1px solid var(--bd);color:var(--tx-body);padding:8px 18px;border-radius:28px;font-size:12px;font-weight:600;z-index:900;opacity:0;transition:.28s;pointer-events:none;white-space:nowrap;max-width:92vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.overlay-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);display:none;align-items:flex-end;justify-content:center}
.overlay-bg.open{display:flex}
.overlay-sheet{width:100%;max-width:420px;background:var(--l1);border-radius:20px 20px 0 0;animation:slideUp .28s ease;max-height:88vh;overflow-y:auto;scrollbar-width:none;padding-bottom:env(safe-area-inset-bottom,20px)}
.overlay-sheet::-webkit-scrollbar{display:none}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.overlay-handle{width:36px;height:4px;background:rgba(0,0,0,.12);border-radius:4px;margin:12px auto 0}
.overlay-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px}
.overlay-hdr h3{font-size:14px;font-weight:800;color:var(--tx-high);display:flex;align-items:center;gap:7px}
.overlay-close{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.05);border:none;color:#666;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.composer-body{padding:0 16px 14px}
.composer-types{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.composer-types::-webkit-scrollbar{display:none}
.ctype{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--bd);color:#777;transition:.2s}
.ctype.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.composer-textarea{width:100%;background:rgba(0,0,0,.02);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;color:var(--tx-high);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;resize:none;line-height:1.55;min-height:80px;margin-bottom:10px}
.composer-textarea::placeholder{color:#999}
.composer-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.composer-media-row{display:flex;gap:7px}
.cmedia-btn{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.04);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;color:#666}
.composer-right{display:flex;gap:8px;align-items:center}
.composer-audience{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.04);border:1px solid var(--bd);border-radius:20px;padding:5px 10px;cursor:pointer;font-size:9px;font-weight:700;color:#555}
.composer-post-btn{background:var(--acc);color:#fff;border:none;padding:8px 18px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 0 14px var(--glow-sm)}
[data-theme="light"] .composer-audience{background:rgba(0,0,0,.04);color:#555}
</style>
</head>

<script>
function toast(msg, dur=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), dur);
}
function fmtN(n) {
  if(typeof n==='string') return n;
  return n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n);
}
function escAttr(s){ return String(s||'').replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }

const THEME_KEY = 'dro_search_theme_v1';
function loadSavedTheme(){ try{ return localStorage.getItem(THEME_KEY)==='dark' ? 'dark':'light'; }catch(e){ return 'light'; } }
function saveTheme(t){ try{ localStorage.setItem(THEME_KEY,t); }catch(e){} }
function applyThemeIcon(theme){
  const icon = document.getElementById('themeIcon');
  if (icon) icon.className = theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute('content', theme === 'light' ? '#ffffff' : '#000000');
}
function toggleTheme(){
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  applyThemeIcon(next);
  saveTheme(next);
  if(window.DroboardSearch) DroboardSearch.setTheme(next);
  if(window.DroboardNav) DroboardNav.setTheme(next);
  toast(next === 'light' ? '☀️ Light mode on' : '🌙 Dark mode on');
}
(function initTheme(){
  const saved = loadSavedTheme();
  document.documentElement.setAttribute('data-theme', saved);
  applyThemeIcon(saved);
})();

let STORIES_CACHE = [];
let FEED_POSTS = [];

document.getElementById('composerAv').src = FeedData.YOU_AV;

function renderStories(stories){
  document.getElementById('storiesRow').innerHTML = stories.map(s=>`
    <div class="story-item" data-story-id="${s.id}" data-you="${!!s.you}">
      <div class="story-ring ${s.you?'own':''}"><div class="inner">
        ${s.you?`<div class="story-add">+</div>`:`<img class="story-avatar" src="${s.avatar}" alt="${escAttr(s.name)}">`}
      </div></div>
      <div class="story-name">${s.name}</div>
    </div>`).join('');
}
function bindStories(){
  document.getElementById('storiesRow').addEventListener('click', (e) => {
    const item = e.target.closest('.story-item');
    if (!item) return;
    if (item.dataset.you === 'true') { toast('📸 Add to your story'); return; }
    const viewable = STORIES_CACHE.filter(s => !s.you && s.statuses && s.statuses.length);
    if (!viewable.length) { toast('No statuses available'); return; }
    openStatusViewer(viewable, item.dataset.storyId);
  });
}
window.onStatusViewerChange = function (wid, ring) {
  const s = STORIES_CACHE.find(x => x.id === wid);
  if (s) s.ring = ring;
};

    cta: 'Go Premium', likes: 128, liked: false, comments: 12,

    cat: 'Romance', genre: 'Romance', author: 'MayaWrites', authorName: 'MayaWrites',
    desc: 'A story that refuses to end where you expect.',
    preview: 'A story that refuses to end where you expect.',

  const demoFollow = {

  const demoBanner = {

  // Max 3 natives

  // ALL other ad types (one of each so every type renders)

  // Guarantee every non-native type appears

    { format: 'platform', ad: demoPlatform },
    { format: 'storyPromo', ad: demoStory },
    { format: 'listPlatform', ad: demoPlatform },
    { format: 'listBook', ad: demoStory },
    { format: 'follow', ad: demoFollow },
    { format: 'banner', ad: demoBanner },
  ];
  ensure.forEach(slot => {
    if (!others.some(o => o.format === slot.format)) others.push(slot);
  });

  // Scatter: other, native, other, native, other, native, other...
  // so natives are never adjacent and all other types still show
  const rotation = [];
  let ni = 0, oi = 0;
  // Start with an other type so first ad slot isn't always native
  while (ni < natives.length || oi < others.length) {
    if (oi < others.length) rotation.push(others[oi++]);
    if (ni < natives.length) rotation.push({ format: 'native', ad: natives[ni++] });
  }

  const out = [];
  let adTurn = 0;
  let adsInserted = 0;

  function nextAd(i) {
    const slot = rotation[adTurn % rotation.length];
    adTurn++;
    adsInserted++;
    return {
      id: 'sp_' + (slot.ad.id || adTurn) + '_' + i + '_' + slot.format,
      type: 'sponsored',
      adFormat: slot.format,
      ad: slot.ad,
    };
  }

  posts.forEach((post, i) => {
    out.push(post);
    if ((i + 1) % 3 === 0) out.push(nextAd(i));
  });
  if (posts.length > 0 && adsInserted === 0) out.push(nextAd(posts.length));
  return out;
}

function storyRefFor(post){
  if (post.type === 'chapter-drop' && post.chapterRef) return { title: post.chapterRef.title, cover: post.chapterRef.cover, author: post.name };
  if ((post.type === 'review' || post.type === 'recommendation') && post.storyRef) return { title: post.storyRef.title, cover: post.storyRef.cover, author: post.storyRef.author };
  if (post.type === 'repost' && post.original) return { title: post.original.title, cover: post.original.cover, author: post.original.name };
  return null;
}

/* ── Wire DroboardPostCard (same pattern as reaction-picker / ad-card) ── */
function bindPostCard(){
  DroboardPostCard.attach(document.getElementById('feedList'), {
    getReactionHTML: (post) => DroboardReactionPicker.renderTrigger(post.id, { liked: post.liked, likeCount: post.likes }),
    renderSponsored: (post) => {
      if (!post || !post.ad) {
        return '<div class="pc-ad-wrap" style="padding:14px;background:var(--l1);color:var(--tx-muted);font-size:12px">Sponsored slot (no ad data)</div>';
      }
      if (!window.DroboardAdCard) {
        return '<div class="pc-ad-wrap" style="padding:14px;background:var(--l1);color:var(--tx-muted);font-size:12px">Sponsored · ad-card.js missing</div>';
      }
      let inner = '';
      try {
        const fmt = post.adFormat || '';
        if (fmt === 'listBook' || fmt === 'book') {
          inner = DroboardAdCard.renderListBook(post.ad);
        } else if (fmt === 'listPlatform') {
          inner = DroboardAdCard.renderListPlatform(post.ad);
        } else if (fmt === 'storyPromo') {
          inner = DroboardAdCard.renderStoryPromo(post.ad);
        } else if (fmt === 'platform') {
          inner = DroboardAdCard.renderPlatform(post.ad);
        } else if (fmt === 'follow') {
          inner = DroboardAdCard.renderFollowPromo(post.ad);
        } else if (fmt === 'banner') {
          inner = DroboardAdCard.renderBanner(post.ad);
        } else if (fmt === 'fullscreen') {
          inner = DroboardAdCard.renderFullscreen(post.ad);
        } else if (fmt === 'native') {
          inner = DroboardAdCard.renderNative(post.ad);
        } else {
          // fallback: platform if DroBoard brand, else native
          if (String(post.ad.brand || post.ad.sponsor || '').toLowerCase().includes('droboard')) {
            inner = DroboardAdCard.renderPlatform(post.ad);
          } else {
            inner = DroboardAdCard.renderNative(post.ad);
          }
        }
      } catch (err) {
        inner = '<div style="padding:14px;color:var(--acc);font-size:12px">Ad render error: ' + String(err.message || err) + '</div>';
      }
      // list styles get a little horizontal padding so gold cards don't touch edges
      const pad = (post.adFormat === 'listBook' || post.adFormat === 'listPlatform')
        ? 'padding:8px 14px;background:var(--l1)'
        : '';
      return '<div class="pc-ad-wrap" style="' + pad + '">' + (inner || '') + '</div>';
    },
    onAvatarClick: (post) => toast('👀 Viewing profile…'),
    onComment: (post) => toast('💬 Opening comments…'),
    onShare: (post) => openShareModal({
      title: (post.chapterRef && post.chapterRef.title) || (post.storyRef && post.storyRef.title) || (post.original && post.original.title) || (post.heading) || (post.text ? post.text.slice(0, 60) : `${post.name}'s post`),
      sub: '@' + post.name,
      img: post.image || (post.chapterRef && post.chapterRef.cover) || (post.storyRef && post.storyRef.cover) || (post.original && post.original.cover) || '',
      url: 'https://droboard.app/post/' + post.id,
    }),
    onSave: (post) => {
      const ref = storyRefFor(post);
      if (ref) {
        openSaveModal({ title: ref.title, sub: 'by @' + ref.author, img: ref.cover, storyId: post.id });
      } else {
        post.saved = !post.saved;
        DroboardPostCard.update(post);
        toast(post.saved ? '🔖 Saved!' : 'Removed from saved');
      }
    },
    onDots: (post, anchor) => {
      if (window.DroboardDotsMenu) DroboardDotsMenu.open(post, anchor);
      else toast('More options…');
    },
    onJoinAma: (post) => toast('🎙️ Joining AMA…'),
    onOpenLink: (post) => toast('📖 Opening story…'),
    onPollVote: (post, i) => {
      if (post.poll.voted >= 0) { toast('✅ Already voted!'); return; }
      post.poll.opts[i].v++;
      post.poll.voted = i;
      post.poll.total = (post.poll.total || 0) + 1;
      DroboardPostCard.update(post);
      toast('✅ Vote cast!');
    },
    onDebateVote: (post, side) => {
      if (post.debateData.userVote) { toast('✅ Already voted!'); return; }
      post.debateData.userVote = side;
      if (side === 'for') post.debateData.forV = (post.debateData.forV || 0) + 1;
      else post.debateData.agV = (post.debateData.agV || 0) + 1;
      DroboardPostCard.update(post);
      toast(side === 'for' ? '✅ Voted FOR!' : '❌ Voted AGAINST!');
    },
  });
}

function bindAdCard(){
  DroboardAdCard.attach(document.getElementById('feedList'), {
    getAds: () => FEED_POSTS.filter(p => p.type === 'sponsored').map(p => p.ad),
    onOpen: () => toast('📖 Opening sponsored story…'),
    onLike: (ad) => {
      ad.liked = !ad.liked;
      ad.likes += ad.liked ? 1 : -1;
      const card = document.querySelector(`.dac-native[data-adid="${ad.id}"]`);
      if (card) {
        const btn = card.querySelector('.dac-like');
        btn.classList.toggle('dac-liked', ad.liked);
        btn.querySelector('i').className = (ad.liked ? 'fas' : 'far') + ' fa-heart';
        btn.querySelector('.dac-like-ct').textContent = fmtN(ad.likes);
      }
    },
    onComment: () => toast('💬 Opening comments…'),
    onShare: (ad) => openShareModal({ title: ad.heading || ad.title || ad.brand, sub: ad.brand, img: ad.image || ad.cover || '', url: 'https://droboard.app/ad/' + ad.id }),
    onCta: (ad) => toast('🔗 Opening ' + (ad.brand || ad.cta || 'link') + '…'),
  });
}

function bindReactionPicker(){
  DroboardReactionPicker.attach(document.getElementById('feedList'), {});
}

window.onDroboardSaveChange = function (storyId, saved) {
  if (!storyId) return;
  const post = FEED_POSTS.find(p => p.id === storyId);
  if (post) {
    post.saved = saved;
    DroboardPostCard.update(post);
  }
};

document.querySelectorAll('.f-tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.f-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
  });
});

function openPostComposer(type) {
  document.getElementById('postComposerOv').classList.add('open');
  document.body.style.overflow = 'hidden';
  if(type) document.querySelectorAll('.ctype').forEach(t => t.classList.toggle('active', t.dataset.ct===type));
}
function closePostComposer() { document.getElementById('postComposerOv').classList.remove('open'); document.body.style.overflow=''; }
document.querySelectorAll('.ctype').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ctype').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
function submitPost() {
  const text = document.getElementById('composerText').value.trim();
  if (!text) { toast('✍️ Write something first!'); return; }
  const newPost = {
    id: 'p_' + Date.now(), type:'post', name:'You', avatar: FeedData.YOU_AV,
    time:'Just now', text, likes:0, liked:false, comments:0,
  };
  FEED_POSTS.unshift(newPost);
  closePostComposer();
  document.getElementById('composerText').value = '';
  DroboardPostCard.setPosts(FEED_POSTS);
  toast('✅ Post published!');
}

async function loadNotifCount() {
  const count = await FeedData.getNotifCount();
  const badge = document.getElementById('notifCount');
  if (count > 0) { badge.textContent = count > 99 ? '99+' : String(count); badge.style.display = 'flex'; }
  else { badge.style.display = 'none'; }
}

async function boot(){
  if (window.DroboardNav) DroboardNav.configure({ active: 'feed' });
  if (window.DroboardDotsMenu) {
    DroboardDotsMenu.configure({
      onEdit:     (post) => toast('✏️ Edit · ' + (post.name || '')),
      onDelete:   (post) => {
        const i = FEED_POSTS.findIndex(p => p.id === post.id);
        if (i >= 0) {
          FEED_POSTS.splice(i, 1);
          DroboardPostCard.setPosts(FEED_POSTS);
          toast('🗑️ Post deleted');
        }
      },
      onReport:   () => toast('🚩 Reported. Thanks for flagging.'),
      onLess:     () => toast('Got it — showing less of this.'),
      onFollow:   (post) => toast('Following @' + (post.name || 'user')),
      onMute:     (post) => toast('Muted @' + (post.name || 'user')),
      onCopyLink: (post) => {
        const url = 'https://droboard.app/post/' + post.id;
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('🔗 Link copied')).catch(() => toast('🔗 ' + url));
        else toast('🔗 ' + url);
      },
    });
  }
  bindStories();
  loadNotifCount();

  const [stories, posts] = await Promise.all([
    FeedData.getStories(),
    FeedData.getFeedPosts(),
  ]);

  document.getElementById('loadingState').style.display = 'none';

  STORIES_CACHE = stories;
  FEED_POSTS = interleaveAds(posts);
  renderStories(STORIES_CACHE);

  if (!FEED_POSTS.length) {
    document.getElementById('emptyState').style.display = 'block';
  } else {
    bindPostCard();
    bindReactionPicker();
    bindAdCard();
    DroboardPostCard.setPosts(FEED_POSTS);
  }

  if (window.DroboardSearch) {
    DroboardSearch.configure({
      onOpenStory: () => toast('📖 Opening story…'),
      onOpenWriter: () => { location.href = 'profile.html'; },
      onOpenDebate: () => toast('⚔️ Opening debate…'),
    });
  }
}
boot();
</script>
