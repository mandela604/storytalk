<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Book Management — Droboard Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:'Inter',system-ui,sans-serif}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.page-hdr-row{display:flex;justify-content:flex-end;margin-bottom:18px}.date-btn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);padding:9px 15px;border-radius:11px;font-size:12.5px;font-weight:600;color:var(--text);box-shadow:var(--shadow);cursor:pointer}.date-btn i{color:var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:22px}.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}.stat-top{display:flex;align-items:center;justify-content:space-between}.stat-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px}.stat-ico.purple{background:#efe7fd;color:var(--accent)}.stat-ico.green{background:var(--green-bg);color:var(--green)}.stat-ico.amber{background:var(--amber-bg);color:var(--amber)}.stat-ico.red{background:var(--red-bg);color:var(--red)}.stat-ico.blue{background:var(--blue-bg);color:var(--blue)}html[data-theme="dark"] .stat-ico.purple{background:rgba(124,58,237,.18)}html[data-theme="dark"] .stat-ico.green{background:rgba(22,163,74,.18)}html[data-theme="dark"] .stat-ico.amber{background:rgba(217,119,6,.18)}html[data-theme="dark"] .stat-ico.red{background:rgba(220,38,38,.18)}html[data-theme="dark"] .stat-ico.blue{background:rgba(37,99,235,.18)}.stat-delta{font-size:11px;font-weight:700;color:var(--green);background:var(--green-bg);padding:3px 8px;border-radius:20px}html[data-theme="dark"] .stat-delta{background:rgba(22,163,74,.18)}.stat-num{font-size:24px;font-weight:800;line-height:1}.stat-lbl{font-size:12.5px;color:var(--text-muted);font-weight:600}
.filters-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;flex-wrap:wrap}.filt-search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px}.filt-search input{border:none;background:none;outline:none;color:var(--text);font-size:13px;flex:1;font-family:inherit}.filt-search input::placeholder{color:var(--text-faint)}.filt-search i{color:var(--text-faint);font-size:13px}.filt-select{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--text);position:relative}.filt-select select{appearance:none;border:none;background:none;outline:none;color:var(--text);font-size:12.5px;font-weight:600;font-family:inherit;padding-right:14px;cursor:pointer}.filt-select i{color:var(--text-faint);font-size:10px;position:absolute;right:11px;pointer-events:none}.btn-more{display:flex;align-items:center;gap:7px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit}.btn-add{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(255,0,80,.35);white-space:nowrap;cursor:pointer;font-family:inherit}.btn-add:hover{background:var(--accent-2)}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:16px;overflow:hidden}.tabs-row{display:flex;align-items:center;gap:26px;padding:16px 20px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}.tabs-row::-webkit-scrollbar{display:none}.tab-item{display:flex;align-items:center;gap:7px;padding-bottom:14px;font-size:13px;font-weight:700;color:var(--text-muted);white-space:nowrap;border-bottom:2.5px solid transparent;flex-shrink:0;cursor:pointer;transition:.15s}.tab-item:hover{color:var(--text)}.tab-item.active{color:var(--accent);border-bottom-color:var(--accent)}.tab-count{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:20px;background:var(--hover);color:var(--text-muted)}.tab-item.active .tab-count{background:var(--accent-soft);color:var(--accent)}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:860px}thead th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase;background:var(--table-head);padding:13px 20px;white-space:nowrap}tbody td{padding:14px 20px;border-top:1px solid var(--border);font-size:13px;vertical-align:middle}tbody tr{transition:.1s}tbody tr:hover{background:var(--hover)}.book-cell{display:flex;align-items:center;gap:12px}.book-cover{width:42px;height:56px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.18);background:#1a1a2e}.book-cover img{width:100%;height:100%;object-fit:cover}.book-title{font-weight:700;font-size:13px;line-height:1.3}.book-id{font-size:11px;color:var(--text-faint);margin-top:2px}.author-cell{display:flex;align-items:center;gap:9px}.author-cell img{width:30px;height:30px;border-radius:50%;object-fit:cover}.author-name{font-weight:600;font-size:12.5px}.cat-main{font-weight:600;font-size:12.5px}.cat-sub{font-size:11px;color:var(--text-muted);margin-top:1px}.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;white-space:nowrap}.status-pill .dot{width:6px;height:6px;border-radius:50%}.status-pill.published{background:var(--green-bg);color:var(--green)}.status-pill.published .dot{background:var(--green)}.status-pill.draft{background:var(--blue-bg);color:var(--blue)}.status-pill.draft .dot{background:var(--blue)}.status-pill.review{background:var(--amber-bg);color:var(--amber)}.status-pill.review .dot{background:var(--amber)}.status-pill.flagged{background:var(--red-bg);color:var(--red)}.status-pill.flagged .dot{background:var(--red)}html[data-theme="dark"] .status-pill.published{background:rgba(22,163,74,.16)}html[data-theme="dark"] .status-pill.draft{background:rgba(37,99,235,.16)}html[data-theme="dark"] .status-pill.review{background:rgba(217,119,6,.16)}html[data-theme="dark"] .status-pill.flagged{background:rgba(220,38,38,.16)}.views-cell{font-weight:600}.muted-cell{color:var(--text-faint)}.actions-cell{display:flex;align-items:center;gap:6px}.act-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;cursor:pointer;transition:.15s;font-family:inherit}.act-btn:hover{color:var(--accent);border-color:var(--accent)}.empty-row td{text-align:center;padding:46px 20px;color:var(--text-muted)}.empty-row i{font-size:26px;display:block;margin-bottom:10px;color:var(--text-faint)}
.pagination-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;flex-wrap:wrap;gap:10px}.page-info{font-size:12px;color:var(--text-muted)}.page-info b{color:var(--text);font-weight:700}.page-btns{display:flex;align-items:center;gap:6px}.pg-btn{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;font-family:inherit}.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}.pg-btn:disabled{opacity:.4;cursor:default}.pg-dots{color:var(--text-faint);font-size:12px;padding:0 2px}
@media (max-width:1200px){.stats-grid{grid-template-columns:repeat(3,1fr)}}@media (max-width:860px){.stats-grid{grid-template-columns:repeat(2,1fr)}}@media (max-width:680px){.filters-card{flex-direction:column;align-items:stretch}.filt-select,.btn-more,.btn-add{width:100%;justify-content:center}.filt-select select{flex:1}.date-btn{width:100%;justify-content:center}.page-hdr-row{justify-content:stretch}.table-wrap{overflow:visible}table,thead,tbody,tr,td{display:block;width:100%}thead{display:none}tbody tr{border:1px solid var(--border);border-radius:12px;margin:0 14px 14px;padding:6px 4px}tbody tr:hover{background:var(--card)}tbody td{border-top:none;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px}tbody td[data-label]::before{content:attr(data-label);font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);flex-shrink:0}.book-cell,.author-cell{flex:1;justify-content:flex-start}td[data-label="Book Details"]{align-items:flex-start}td[data-label="Book Details"]::before{display:none}.actions-cell{justify-content:flex-end;width:100%}}@media (max-width:420px){.stats-grid{grid-template-columns:1fr}}
</style></head>
<body><div id="dashboardRoot">
<div class="page-hdr-row"><button class="date-btn"><i class="fas fa-calendar"></i> Jun 1 – Jun 17, 2026</button></div>
<div class="stats-grid" id="statsGrid"></div>
<div class="filters-card">
<div class="filt-search"><i class="fas fa-magnifying-glass"></i><input id="tableSearch" placeholder="Search by book title, author, or ID..."/></div>
<div class="filt-select"><select id="fCategory"><option>All Categories</option><option>Romance</option><option>Urban</option><option>Fantasy</option><option>Revenge</option><option>Campus</option><option>Elegy</option></select><i class="fas fa-chevron-down"></i></div>
<div class="filt-select"><select id="fGenre"><option>All Genres</option><option>Billionaire Romance</option><option>Werewolf Romance</option><option>Mafia Romance</option><option>Vampire Romance</option><option>Second Chance</option><option>Royal Romance</option><option>Revenge</option><option>Betrayal</option><option>Family Drama</option><option>Twist</option></select><i class="fas fa-chevron-down"></i></div>
<div class="filt-select"><select id="fStatus"><option>All Status</option><option>Published</option><option>Draft</option><option>Under Review</option><option>Flagged</option></select><i class="fas fa-chevron-down"></i></div>
<button class="btn-more" onclick="toast('Advanced filters panel opened')"><i class="fas fa-sliders"></i> More Filters</button>
<button class="btn-add" id="addBookBtn"><i class="fas fa-plus"></i> Add New Book</button>
</div>
<div class="table-card">
<div class="tabs-row" id="tabsRow">
<div class="tab-item active" data-tab="all">All Books <span class="tab-count" id="countAll">0</span></div>
<div class="tab-item" data-tab="Published">Published <span class="tab-count">0</span></div>
<div class="tab-item" data-tab="Draft">Draft <span class="tab-count">0</span></div>
<div class="tab-item" data-tab="Under Review">Under Review <span class="tab-count">0</span></div>
<div class="tab-item" data-tab="Flagged">Flagged <span class="tab-count">0</span></div>
</div>
<div class="table-wrap"><table><thead><tr><th>Book Details</th><th>Author</th><th>Category / Genre</th><th>Status</th><th>Views</th><th>Added On</th><th>Actions</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<div class="pagination-row"><div class="page-info" id="pageInfo">Loading...</div><div class="page-btns" id="pageBtns"></div></div>
</div></div>
<script src="shared/api.js"></script>
<script src="shared/dashboard-shell.js"></script>
<script>
DroboardShell.attach('#dashboardRoot',{activeFile:'book-management.html',title:'Book Management',subtitle:'Manage and organize all books on your platform',user:{name:'Reina Morgan',role:'General Editor',avatar:'https://i.pravatar.cc/100?img=47'},notifCount:8,searchPlaceholder:'Search by book title, author, or ID...',mobileSearchTarget:'#tableSearch',onSearch:(v)=>{document.getElementById('tableSearch').value=v;refresh();}});
let activeTab='all',currentPage=1;
function statusClass(s){return{Published:'published',Draft:'draft','Under Review':'review',Flagged:'flagged'}[s]||'draft'}
function statusPillHtml(s){return'<span class="status-pill '+statusClass(s)+'"><span class="dot"></span>'+s+'</span>'}
async function refresh(){try{const q=document.getElementById('tableSearch').value.trim(),cat=document.getElementById('fCategory').value,genre=document.getElementById('fGenre').value,stat=document.getElementById('fStatus').value;const res=await DroboardAPI.getBooks({tab:activeTab,search:q,category:cat,genre,status:stat==='All Status'?null:stat});allBooks=res.items;renderTable();renderStats();renderTabs()}catch(e){toast('Error: '+e.message)}}
let allBooks=[];const PER_PAGE=8;
function renderTable(){const body=document.getElementById('tableBody'),total=allBooks.length,totalPages=Math.max(1,Math.ceil(total/PER_PAGE));if(currentPage>totalPages)currentPage=totalPages;const start=(currentPage-1)*PER_PAGE,page=allBooks.slice(start,start+PER_PAGE);if(!page.length){body.innerHTML='<tr class="empty-row"><td colspan="7"><i class="fas fa-inbox"></i>No books match this filter.</td></tr>'}else{body.innerHTML=page.map(b=>'<tr><td data-label="Book Details"><div class="book-cell"><div class="book-cover"><img src="'+b.img+'" alt=""/></div><div><div class="book-title">'+b.title+'</div><div class="book-id">ID: '+b.id+'</div></div></div></td><td data-label="Author"><div class="author-cell"><img src="'+b.avatar+'" alt=""/><span class="author-name">'+b.author+'</span></div></td><td data-label="Category / Genre"><div class="cat-main">'+b.cat+'</div><div class="cat-sub">'+b.genre+'</div></td><td data-label="Status">'+statusPillHtml(b.status)+'</td><td data-label="Views" class="'+(b.views==='—'?'muted-cell':'views-cell')+'">'+b.views+'</td><td data-label="Added On" class="muted-cell">'+b.added+'</td><td data-label="Actions"><div class="actions-cell"><button class="act-btn" title="View" onclick="viewBook(\''+b.id+'\')"><i class="fas fa-eye"></i></button><button class="act-btn" title="Edit" onclick="editBook(\''+b.id+'\')"><i class="fas fa-pen"></i></button><button class="act-btn" title="Delete" onclick="deleteBook(\''+b.id+'\')"><i class="fas fa-trash"></i></button></div></td></tr>').join('')}
document.getElementById('pageInfo').innerHTML=total?'Showing <b>'+(start+1)+'</b> to <b>'+Math.min(start+PER_PAGE,total)+'</b> of <b>'+total.toLocaleString()+'</b> books':'No books found';renderPagination(totalPages)}
function renderPagination(tp){const w=document.getElementById('pageBtns');if(tp<=1){w.innerHTML='';return}let h='<button class="pg-btn"'+(currentPage<=1?' disabled':'')+' onclick="goPage('+(currentPage-1)+')"><i class="fas fa-chevron-left"></i></button>';const sP=Math.max(1,currentPage-2),eP=Math.min(tp,currentPage+2);if(sP>1)h+='<button class="pg-btn" onclick="goPage(1)">1</button>'+(sP>2?'<span class="pg-dots">…</span>':'');for(let i=sP;i<=eP;i++)h+='<button class="pg-btn'+(i===currentPage?' active':'')+'" onclick="goPage('+i+')">'+i+'</button>';if(eP<tp)h+=(eP<tp-1?'<span class="pg-dots">…</span>':'')+'<button class="pg-btn" onclick="goPage('+tp+')">'+tp+'</button>';h+='<button class="pg-btn"'+(currentPage>=tp?' disabled':'')+' onclick="goPage('+(currentPage+1)+')"><i class="fas fa-chevron-right"></i></button>';w.innerHTML=h}
function goPage(p){currentPage=p;renderTable();window.scrollTo({top:0,behavior:'smooth'})}
function renderStats(){const b=DroboardAPI._books,t=b.length,p=b.filter(x=>x.status==='Published').length,d=b.filter(x=>x.status==='Draft').length,r=b.filter(x=>x.status==='Under Review').length,f=b.filter(x=>x.status==='Flagged').length;document.getElementById('statsGrid').innerHTML='<div class="stat-card"><div class="stat-top"><div class="stat-ico purple"><i class="fas fa-book"></i></div><span class="stat-delta">+18%</span></div><div class="stat-num">'+t+'</div><div class="stat-lbl">Total Books</div></div><div class="stat-card"><div class="stat-top"><div class="stat-ico green"><i class="fas fa-circle-check"></i></div><span class="stat-delta">+15%</span></div><div class="stat-num">'+p+'</div><div class="stat-lbl">Published Books</div></div><div class="stat-card"><div class="stat-top"><div class="stat-ico amber"><i class="fas fa-clock"></i></div><span class="stat-delta">+8%</span></div><div class="stat-num">'+d+'</div><div class="stat-lbl">Draft Books</div></div><div class="stat-card"><div class="stat-top"><div class="stat-ico red"><i class="fas fa-flag"></i></div><span class="stat-delta">+5%</span></div><div class="stat-num">'+f+'</div><div class="stat-lbl">Flagged Books</div></div><div class="stat-card"><div class="stat-top"><div class="stat-ico blue"><i class="fas fa-eye"></i></div><span class="stat-delta">+22%</span></div><div class="stat-num">12.4M</div><div class="stat-lbl">Total Views</div></div>'}
function renderTabs(){const counts={all:DroboardAPI._books.length};['Published','Draft','Under Review','Flagged'].forEach(s=>counts[s]=DroboardAPI._books.filter(b=>b.status===s).length);document.getElementById('countAll').textContent=counts.all;document.querySelectorAll('.tab-item').forEach(t=>{const k=t.dataset.tab,c=t.querySelector('.tab-count');if(c&&counts[k]!==undefined)c.textContent=counts[k]})}
document.querySelectorAll('.tab-item').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));tab.classList.add('active');activeTab=tab.dataset.tab;currentPage=1;refresh()})});
['tableSearch','fCategory','fGenre','fStatus'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener(id==='tableSearch'?'input':'change',()=>{currentPage=1;refresh()})});
function viewBook(id){const b=DroboardAPI._books.find(x=>x.id===id);if(!b)return;DroboardModal.show('<h2>'+b.title+'</h2><div class="sub">ID: '+b.id+' · by '+b.author+'</div><div style="display:flex;gap:16px;margin-bottom:16px"><img src="'+b.img+'" style="width:80px;height:106px;border-radius:8px;object-fit:cover;border:1px solid var(--border)"/><div style="flex:1"><div class="drm-form-group"><label>Category</label><div style="font-size:13px;font-weight:600">'+b.cat+'</div></div><div class="drm-form-group"><label>Genre</label><div style="font-size:13px;font-weight:600">'+b.genre+'</div></div><div class="drm-form-group"><label>Status</label><div>'+statusPillHtml(b.status)+'</div></div></div></div><div class="drm-form-actions"><button class="drm-btn drm-cancel" onclick="DroboardModal.closeTop()">Close</button></div>')}
function editBook(id){const b=DroboardAPI._books.find(x=>x.id===id);if(!b)return;DroboardModal.show('<h2>Edit Book</h2><div class="sub">'+b.id+' - '+b.title+'</div><div class="drm-form-group"><label>Title</label><input id="e-title" value="'+b.title.replace(/"/g,'"')+'"/></div><div class="drm-form-group"><label>Author</label><input id="e-author" value="'+b.author.replace(/"/g,'"')+'"/></div><div class="drm-form-group"><label>Status</label><select id="e-status"><option'+(b.status==='Published'?' selected':'')+'>Published</option><option'+(b.status==='Draft'?' selected':'')+'>Draft</option><option'+(b.status==='Under Review'?' selected':'')+'>Under Review</option><option'+(b.status==='Flagged'?' selected':'')+'>Flagged</option></select></div><div class="drm-form-actions"><button class="drm-btn drm-cancel" onclick="DroboardModal.closeTop()">Cancel</button><button class="drm-btn drm-ok" id="e-save">Save</button></div>');document.getElementById('e-save').addEventListener('click',async()=>{await DroboardAPI.updateBook(id,{title:document.getElementById('e-title').value,author:document.getElementById('e-author').value,status:document.getElementById('e-status').value});DroboardModal.closeTop();toast('Book updated');refresh()})}
async function deleteBook(id){const b=DroboardAPI._books.find(x=>x.id===id),ok=await DroboardModal.confirm('Delete "'+(b?b.title:id)+'"? This cannot be undone.','Delete Book');if(!ok)return;await DroboardAPI.deleteBook(id);toast('Book deleted');refresh()}
document.getElementById('addBookBtn').addEventListener('click',()=>{DroboardModal.show('<h2>Add New Book</h2><div class="sub">Create a new book entry</div><div class="drm-form-group"><label>Title *</label><input id="a-title" placeholder="Enter book title"/></div><div class="drm-form-group"><label>Author *</label><input id="a-author" placeholder="Enter author name"/></div><div class="drm-form-group"><label>Category</label><select id="a-cat"><option>Romance</option><option>Urban</option><option>Fantasy</option><option>Revenge</option><option>Campus</option></select></div><div class="drm-form-actions"><button class="drm-btn drm-cancel" onclick="DroboardModal.closeTop()">Cancel</button><button class="drm-btn drm-ok" id="a-save">Create</button></div>');document.getElementById('a-save').addEventListener('click',async()=>{const t=document.getElementById('a-title').value.trim(),a=document.getElementById('a-author').value.trim();if(!t||!a){toast('Title and author required');return}await DroboardAPI.createBook({title:t,author:a,cat:document.getElementById('a-cat').value});DroboardModal.closeTop();toast('Book created!');currentPage=1;activeTab='all';document.querySelectorAll('.tab-item').forEach(x=>x.classList.toggle('active',x.dataset.tab==='all'));refresh()})});
refresh();
</script></body></html>
