<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#ffffff"/>
<title>Droboard · Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{
  --acc:#ff0050;--acc2:#ff4d7a;--acc3:#ff7a9a;
  --glow:rgba(255,0,80,.22);--glow-sm:rgba(255,0,80,.12);
  --bg:#000000;--l1:#08090c;--l2:#0e0f13;--l3:#13141a;--l4:#1a1b22;
  --card:#000000;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.04);--bd-acc:rgba(255,0,80,.20);
  --tx-high:#e0e0e0;--tx-body:#c0c0c0;--tx-muted:#71717a;--tx-faint:#3f3f46;
  --tx-title:#e0e0e0;
  --blue:#38bdf8;--green:#34d399;--gold:#fbbf24;--purple:#a78bfa;--orange:#fb923c;
  --nav-h:60px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#f5f5f5;--l1:#ffffff;--l2:#f1f1f1;--l3:#ffffff;--l4:#e8e8e8;
  --card:#ffffff;
  --bd:rgba(0,0,0,.1);--bd2:rgba(0,0,0,.05);--bd-acc:rgba(255,0,80,.25);
  --tx-high:#161616;--tx-body:#3a3a3a;--tx-muted:#666666;--tx-faint:#8a8a8a;
  --tx-title:#161616;
}
[data-theme="light"] body{background:var(--bg);color:var(--tx-body)}
[data-theme="light"] .top-bar,
[data-theme="light"] .feed-tabs{background:rgba(255,255,255,.97);border-color:var(--bd)}
[data-theme="light"] .top-icon-btn{background:var(--l2);color:#555;border-color:var(--bd)}
[data-theme="light"] .composer-input{background:var(--l2);color:#888}
[data-theme="light"] .composer-shortcuts{border-color:var(--bd)}
[data-theme="light"] .story-add{background:var(--l2)}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--tx-body);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body{padding-bottom:calc(var(--safe-b) + var(--nav-h) + 16px);transition:background .25s ease,color .25s ease}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.2);border-radius:2px}

/* ── TOP BAR ── */
.top-bar{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd)}
.top-logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--acc);letter-spacing:-1px;cursor:pointer}
.top-right{display:flex;align-items:center;gap:8px}
.top-icon-btn{width:36px;height:36px;border-radius:50%;background:var(--l2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:#555;transition:.15s;position:relative;flex-shrink:0}
.top-icon-btn:active{transform:scale(.9)}
.notif-count{position:absolute;top:4px;right:4px;background:var(--acc);color:#fff;font-size:7px;font-weight:800;min-width:14px;height:14px;border-radius:7px;padding:0 3px;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}

/* ── FEED TABS ── */
.feed-tabs{display:flex;gap:20px;padding:0 14px;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.97);overflow-x:auto;position:sticky;top:57px;z-index:150;backdrop-filter:blur(12px);scrollbar-width:none}
.feed-tabs::-webkit-scrollbar{display:none}
.f-tab{padding:11px 0;font-size:12.5px;font-weight:700;color:var(--tx-faint);white-space:nowrap;position:relative;cursor:pointer}
.f-tab.active{color:var(--acc)}
.f-tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:3px;background:var(--acc)}

/* ── STORIES ── */
.stories-wrap{padding:12px 0;border-bottom:8px solid var(--bg);background:var(--l1)}
.stories{display:flex;gap:13px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:58px}
.story-ring{width:56px;height:56px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,var(--acc),var(--purple),var(--orange));position:relative;flex-shrink:0}
.story-ring.own{background:var(--bd)}
.story-ring .inner{width:100%;height:100%;border-radius:50%;background:var(--l1);padding:2px}
.story-avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.story-add{width:100%;height:100%;border-radius:50%;background:var(--l2);display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:20px;font-weight:800}
.story-name{font-size:10px;font-weight:600;color:var(--tx-muted);max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── COMPOSER ── */
.composer-block{padding:14px;border-bottom:8px solid var(--bg);background:var(--l1)}
.composer-top{display:flex;align-items:center;gap:11px;cursor:pointer}
.composer-av{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0}
.composer-input{flex:1;background:var(--l2);border-radius:22px;padding:11px 16px;font-size:13.5px;color:var(--tx-faint)}
.composer-shortcuts{display:flex;justify-content:space-between;margin-top:13px;padding-top:12px;border-top:1px solid var(--bd)}
.shortcut{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;cursor:pointer;background:none;border:none;font-family:inherit}
.shortcut-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px}
.shortcut span{font-size:10.5px;font-weight:600;color:var(--tx-muted)}
.sc-photo{background:rgba(56,189,248,.1);color:var(--blue)}
.sc-chapter{background:rgba(167,139,250,.1);color:var(--purple)}
.sc-review{background:rgba(251,191,36,.1);color:#b57e00}
.sc-debate{background:rgba(251,146,60,.1);color:#c2610a}

/* ═══════════ POST CARDS (shared language w/ profile.html) ═══════════ */
.pc-post{width:100%;padding:14px 16px;border-bottom:8px solid var(--bg);background:var(--l1)}
.pc-post:last-child{border-bottom:none}

.pc-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.pc-avatar-wrap{position:relative;flex-shrink:0}
.pc-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block;cursor:pointer}
.pc-avatar-wrap.live .pc-avatar{padding:2px;border:2px solid var(--acc);box-sizing:border-box}
.pc-pin-badge{position:absolute;bottom:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--gold);color:#08090c;display:flex;align-items:center;justify-content:center;font-size:8px;border:2px solid var(--l1)}
.pc-meta{flex:1;min-width:0}
.pc-name-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.pc-name{font-size:14px;font-weight:700;color:var(--tx-high)}
.pc-verified{color:var(--blue);font-size:11px}
.pc-rank{font-size:9px;font-weight:800;color:var(--acc);background:rgba(255,0,80,.08);border:1px solid var(--bd-acc);padding:1px 7px;border-radius:8px;margin-left:2px}
.pc-time{font-size:11.5px;color:var(--tx-muted);margin-top:1px}
.pc-dots{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx-muted);cursor:pointer;flex-shrink:0;background:transparent;border:none;font-size:14px}
.pc-dots:active{background:rgba(0,0,0,.05)}

.type-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.01em;padding:5px 10px;border-radius:20px;margin-bottom:10px;border:1px solid}
.type-pill i{font-size:10px}
.tp-chapter{background:rgba(167,139,250,.08);color:var(--purple);border-color:rgba(167,139,250,.25)}
.tp-ama{background:rgba(255,0,80,.08);color:var(--acc);border-color:var(--bd-acc)}
.tp-quote{background:rgba(251,191,36,.08);color:#b57e00;border-color:rgba(251,191,36,.25)}
.tp-repost{background:rgba(56,189,248,.08);color:#0284c7;border-color:rgba(56,189,248,.25)}
.tp-poll{background:rgba(52,211,153,.08);color:#0d9668;border-color:rgba(52,211,153,.25)}
.tp-debate{background:rgba(251,146,60,.08);color:#c2610a;border-color:rgba(251,146,60,.25)}
.tp-post{background:rgba(255,0,80,.08);color:var(--acc);border-color:var(--bd-acc)}
.tp-review{background:rgba(251,191,36,.08);color:#b57e00;border-color:rgba(251,191,36,.25)}
.tp-recommend{background:rgba(52,211,153,.08);color:#0d9668;border-color:rgba(52,211,153,.25)}
.tp-sponsor{background:var(--l2);color:var(--tx-muted);border-color:var(--bd)}

.pc-text{font-size:14px;line-height:1.55;margin-bottom:11px;color:var(--tx-body);white-space:pre-line}
.pc-image{width:100%;border-radius:12px;margin-bottom:11px;max-height:280px;object-fit:cover;border:1px solid var(--bd);display:block}

/* Chapter drop card */
.pc-chapter-card{border-radius:12px;overflow:hidden;margin-bottom:11px;border:1px solid var(--bd)}
.pc-chapter-cover{width:100%;height:170px;position:relative;background-size:cover;background-position:center}
.pc-chapter-scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,.15) 55%,transparent 100%)}
.pc-chapter-textwrap{position:absolute;left:14px;right:14px;bottom:12px;color:#fff}
.pc-chapter-eyebrow{font-size:10px;font-weight:800;color:var(--acc3);letter-spacing:.05em;margin-bottom:3px;text-transform:uppercase}
.pc-chapter-title{font-family:'Playfair Display',serif;font-size:16.5px;font-weight:800;line-height:1.25}
.pc-chapter-sub{font-size:12px;font-weight:600;opacity:.9;margin-top:2px}
.pc-chapter-panel{padding:12px 14px;background:var(--l1)}
.pc-chapter-desc{font-size:12.5px;color:var(--tx-muted);line-height:1.5;margin-bottom:11px}
.pc-read-btn{background:var(--acc);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 0 14px var(--glow-sm);font-family:'DM Sans',sans-serif}

/* Recommendation / repost link card */
.pc-rec-card{display:flex;align-items:center;gap:11px;background:var(--l2);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin-bottom:11px;cursor:pointer}
.pc-rec-thumb{width:42px;height:56px;border-radius:6px;flex-shrink:0;object-fit:cover;background:var(--bd)}
.pc-rec-title{font-size:12.5px;font-weight:700;color:var(--tx-high);line-height:1.3}
.pc-rec-sub{font-size:11px;color:var(--tx-muted);margin-top:2px}
.pc-rec-arrow{margin-left:auto;color:var(--tx-muted);flex-shrink:0}

/* Quote card */
.pc-quote-card{background:linear-gradient(135deg,rgba(255,0,80,.05),rgba(167,139,250,.05));border:1px solid var(--bd-acc);border-radius:14px;padding:20px 16px 16px;margin-bottom:11px;position:relative}
.pc-quote-mark{position:absolute;top:6px;left:14px;font-family:'Playfair Display',serif;font-size:38px;font-weight:900;color:var(--acc);opacity:.25;line-height:1}
.pc-quote-text{font-family:'Playfair Display',serif;font-style:italic;font-size:14.5px;font-weight:700;color:var(--tx-high);line-height:1.55;margin:10px 0 8px 8px}
.pc-quote-caption{font-size:11.5px;color:var(--tx-muted);font-weight:600;margin-left:8px}

/* AMA live card */
.pc-ama-card{border-radius:14px;overflow:hidden;margin-bottom:11px;background:linear-gradient(135deg,rgba(255,0,80,.08),rgba(167,139,250,.05));border:1px solid var(--bd-acc);padding:16px}
.pc-ama-live-row{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.pc-ama-live-dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pcPulse 1.4s infinite}
.pc-ama-live-text{font-size:10px;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
.pc-ama-viewers{font-size:10px;color:var(--tx-muted);margin-left:auto;font-weight:600;display:flex;align-items:center;gap:4px}
.pc-ama-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:800;color:var(--tx-high);margin-bottom:4px}
.pc-ama-meta{font-size:12px;color:var(--tx-body);line-height:1.5;margin-bottom:12px}
.pc-ama-join{background:var(--acc);color:#fff;border:none;padding:9px 16px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 0 14px var(--glow-sm);font-family:'DM Sans',sans-serif}
@keyframes pcPulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Poll */
.pc-poll-q{font-size:14.5px;font-weight:700;margin-bottom:13px;line-height:1.4;color:var(--tx-high)}
.pc-poll-row{margin-bottom:9px;cursor:pointer}
.pc-poll-label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--tx-body)}
.pc-poll-track{height:8px;border-radius:6px;background:var(--l2);overflow:hidden}
.pc-poll-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.pc-poll-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11.5px;color:var(--tx-muted)}
.pc-poll-voted{color:var(--acc);font-weight:700}

/* Debate */
.pc-debate-q{font-family:'Playfair Display',serif;font-size:16.5px;font-weight:800;margin-bottom:4px;color:var(--tx-high)}
.pc-debate-prompt{font-size:12.5px;color:var(--tx-muted);margin-bottom:13px}
.pc-debate-opts{display:flex;gap:9px;margin-bottom:13px}
.pc-debate-opt{flex:1;border-radius:12px;padding:14px 10px;text-align:center;border:1.5px solid;cursor:pointer;transition:.15s}
.pc-debate-opt.for{background:rgba(52,211,153,.06);border-color:rgba(52,211,153,.25)}
.pc-debate-opt.against{background:rgba(255,0,80,.06);border-color:var(--bd-acc)}
.pc-debate-opt.picked{outline:2px solid currentColor}
.pc-debate-opt-text{font-size:12px;font-weight:700;line-height:1.3;margin-bottom:9px}
.pc-debate-opt.for .pc-debate-opt-text{color:#0d9668}
.pc-debate-opt.against .pc-debate-opt-text{color:var(--acc)}
.pc-debate-icon{margin-bottom:8px;font-size:18px}
.pc-debate-opt.for .pc-debate-icon{color:var(--green)}
.pc-debate-opt.against .pc-debate-icon{color:var(--acc)}
.pc-debate-footer{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--tx-muted)}

/* Repost — reshared post with original author's card nested */
.pc-repost-note{font-size:13.5px;line-height:1.5;margin-bottom:10px;color:var(--tx-body)}
.pc-repost-inner{border:1px solid var(--bd);border-radius:13px;padding:11px 12px;margin-bottom:11px;background:var(--l2)}
.pc-repost-inner-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pc-repost-inner-av{width:26px;height:26px;border-radius:50%;object-fit:cover}
.pc-repost-inner-name{font-size:12px;font-weight:700;color:var(--tx-high)}
.pc-repost-inner-time{font-size:10px;color:var(--tx-muted)}
.pc-repost-inner-text{font-size:12.5px;color:var(--tx-body);line-height:1.5}

/* Recommendation card (distinct from repost — writer recommending a story to followers) */
.pc-recommend-note{font-size:13.5px;line-height:1.55;margin-bottom:11px;color:var(--tx-body)}
.pc-recommend-card{display:flex;gap:12px;background:linear-gradient(135deg,rgba(52,211,153,.05),rgba(56,189,248,.04));border:1px solid rgba(52,211,153,.22);border-radius:13px;padding:11px;margin-bottom:4px;cursor:pointer}
.pc-recommend-cover{width:58px;height:78px;border-radius:8px;flex-shrink:0;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.pc-recommend-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.pc-recommend-badge{font-size:8.5px;font-weight:800;color:#0d9668;text-transform:uppercase;letter-spacing:.05em}
.pc-recommend-title{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;line-height:1.3;color:var(--tx-high);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-recommend-author{font-size:10.5px;color:var(--tx-muted);font-weight:600}

/* Review card — star rating + written review of a story */
.pc-review-card{border:1px solid var(--bd);border-radius:13px;padding:12px;margin-bottom:11px;background:var(--l2)}
.pc-review-top{display:flex;gap:10px;margin-bottom:10px}
.pc-review-cover{width:40px;height:54px;border-radius:6px;flex-shrink:0;object-fit:cover}
.pc-review-storyinfo{flex:1;min-width:0}
.pc-review-storytitle{font-size:12px;font-weight:700;color:var(--tx-high);line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pc-review-stars{display:flex;align-items:center;gap:2px}
.pc-review-stars i{font-size:11px;color:var(--gold)}
.pc-review-stars i.empty{color:var(--bd)}
.pc-review-score{font-size:11px;font-weight:800;color:#b57e00;margin-left:4px}
.pc-review-body{font-size:13px;line-height:1.55;color:var(--tx-body)}

/* Sponsored */
.pc-sponsored-cover{height:170px;border-radius:12px;position:relative;overflow:hidden;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:14px;margin-bottom:11px;border:1px solid var(--bd)}
.pc-sponsored-scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.78) 10%,rgba(0,0,0,.1) 65%)}
.pc-sponsored-title{color:#fff;font-family:'Playfair Display',serif;font-size:17px;font-weight:800;line-height:1.25;position:relative}
.pc-sponsored-sub{color:#f1e2ea;font-size:11.5px;font-weight:500;position:relative;margin-top:3px}
.pc-sponsored-desc{font-size:13px;color:var(--tx-muted);line-height:1.5;margin-bottom:12px}
.pc-sponsored-btn{text-align:center;background:var(--acc);color:#fff;font-weight:700;font-size:13.5px;padding:11px;border-radius:11px;cursor:pointer}

/* Action row */
.pc-actions{display:flex;align-items:center;justify-content:space-between;padding-top:11px;border-top:1px solid var(--bd)}
.pc-action-group{display:flex;align-items:center;gap:22px}
.pc-action{display:flex;align-items:center;gap:6px;color:var(--tx-muted);cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.pc-action i{font-size:16px}
.pc-action span{font-size:12.5px;font-weight:600}
.pc-action.liked{color:var(--acc)}
.pc-action.liked i{font-weight:900}
.pc-save{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx-muted);cursor:pointer;background:none;border:none;font-size:15px}
.pc-save.on{color:var(--gold)}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--safe-b) + var(--nav-h) + 14px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--l3);border:1px solid var(--bd);color:var(--tx-body);padding:8px 18px;border-radius:28px;font-size:12px;font-weight:600;z-index:900;opacity:0;transition:.28s;pointer-events:none;white-space:nowrap;max-width:92vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── COMPOSER SHEET (reuses profile.html patterns) ── */
.overlay-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);display:none;align-items:flex-end}
.overlay-bg.open{display:flex}
.overlay-sheet{width:100%;background:var(--l1);border-radius:20px 20px 0 0;animation:slideUp .28s ease;max-height:88vh;overflow-y:auto;scrollbar-width:none;padding-bottom:env(safe-area-inset-bottom,20px)}
.overlay-sheet::-webkit-scrollbar{display:none}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.overlay-handle{width:36px;height:4px;background:rgba(0,0,0,.12);border-radius:4px;margin:12px auto 0}
.overlay-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px}
.overlay-hdr h3{font-size:14px;font-weight:800;color:var(--tx-high);display:flex;align-items:center;gap:7px}

/* ═══════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════ */
function toast(msg, dur=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), dur);
}
function fmtN(n) {
  if(typeof n==='string') return n;
  return n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n);
}
function escAttr(s){ return String(s||'').replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }
function starsHTML(score){
  const full = Math.round(score);
  let h='';
  for(let i=1;i<=5;i++) h += `<i class="fas fa-star${i>full?' empty':''}"></i>`;
  return h;
}

/* ═══════════════════════════════════════════════════════
   THEME TOGGLE — stays in sync with bottom-nav.js / search-overlay.js
   via the shared 'dro_search_theme_v1' localStorage key.
═══════════════════════════════════════════════════════ */
const THEME_KEY = 'dro_search_theme_v1';
function loadSavedTheme(){ try{ return localStorage.getItem(THEME_KEY)==='dark' ? 'dark':'light'; }catch(e){ return 'light'; } }
function saveTheme(t){ try{ localStorage.setItem(THEME_KEY,t); }catch(e){} }
function applyThemeIcon(theme){
  const icon = document.getElementById('themeIcon');
  if (icon) icon.className = theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute('content', theme === 'light' ? '#ffffff' : '#000000');
}
function toggleTheme(){
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  applyThemeIcon(next);
  saveTheme(next);
  if(window.DroboardSearch) DroboardSearch.setTheme(next);
  if(window.DroboardNav) DroboardNav.setTheme(next);
  toast(next === 'light' ? '☀️ Light mode on' : '🌙 Dark mode on');
}
(function initTheme(){
  const saved = loadSavedTheme();
  document.documentElement.setAttribute('data-theme', saved);
  applyThemeIcon(saved);
})();

/* ═══════════════════════════════════════════════════════
   BACKEND API — real calls with demo data fallback
═══════════════════════════════════════════════════════ */
const API_BASE = 'https://api.droboard.app';
async function apiFetch(endpoint, demoData) {
  try {
    const res = await fetch(API_BASE + endpoint, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('non-2xx');
    return await res.json();
  } catch (_) { return demoData; }
}
async function loadNotifCount() {
  const data = await apiFetch('/v1/notifications/unread-count', { count: 6 });
  const count = data?.count ?? 6;
  const badge = document.getElementById('notifCount');
  if (count > 0) { badge.textContent = count > 99 ? '99+' : String(count); badge.style.display = 'flex'; }
  else { badge.style.display = 'none'; }
}

/* ══════════════════════════════
   POST CARD RENDERING
══════════════════════════════ */
function pcHead(post){
  const ring = post.avatarRing ? ' live' : '';
  return `
    <div class="pc-head">
      <div class="pc-avatar-wrap${ring}">
        <img class="pc-avatar" src="${post.avatar}" alt="${escAttr(post.name)}" data-pc-avatar>
        ${post.pinned ? `<div class="pc-pin-badge"><i class="fas fa-thumbtack"></i></div>` : ''}
      </div>
      <div class="pc-meta">
        <div class="pc-name-row">
          <span class="pc-name">${post.name}</span>
          ${post.verified ? `<i class="fas fa-circle-check pc-verified"></i>` : ''}
          ${post.rank ? `<span class="pc-rank">${post.rank}</span>` : ''}
        </div>
        <div class="pc-time">${post.time}${post.pinned ? ' · 📌 Pinned' : ''}</div>
      </div>
      <button class="pc-dots" data-pc-dots><i class="fas fa-ellipsis"></i></button>
    </div>`;
}

function pcActions(post){
  return `
    <div class="pc-actions">
      <div class="pc-action-group">
        <button class="pc-action${post.liked?' liked':''}" data-pc-like>
          <i class="fa-heart ${post.liked ? 'fas' : 'far'}"></i><span data-pc-like-ct>${fmtN(post.likes)}</span>
        </button>
        <button class="pc-action" data-pc-comment><i class="far fa-comment"></i><span>${fmtN(post.comments)}</span></button>
        <button class="pc-action" data-pc-share><i class="fas fa-share-nodes"></i><span>Share</span></button>
      </div>
      <button class="pc-save" data-pc-save><i class="far fa-bookmark"></i></button>
    </div>`;
}

function typePillHTML(type){
  switch(type){
    case 'chapter-drop': return `<span class="type-pill tp-chapter"><i class="fas fa-book-open"></i>Chapter Drop</span>`;
    case 'ama': return `<span class="type-pill tp-ama"><i class="fas fa-microphone"></i>Live AMA</span>`;
    case 'quote': return `<span class="type-pill tp-quote"><i class="fas fa-quote-right"></i>Quote</span>`;
    case 'repost': return `<span class="type-pill tp-repost"><i class="fas fa-retweet"></i>Repost</span>`;
    case 'poll': return `<span class="type-pill tp-poll"><i class="fas fa-chart-bar"></i>Poll</span>`;
    case 'debate': return `<span class="type-pill tp-debate"><i class="fas fa-gavel"></i>Debate</span>`;
    case 'review': return `<span class="type-pill tp-review"><i class="fas fa-star"></i>Review</span>`;
    case 'recommendation': return `<span class="type-pill tp-recommend"><i class="fas fa-thumbs-up"></i>Recommendation</span>`;
    case 'sponsored': return `<span class="type-pill tp-sponsor"><i class="fas fa-volume-high"></i>Sponsored</span>`;
    default: return `<span class="type-pill tp-post"><i class="fas fa-pen"></i>Author Post</span>`;
  }
}

function renderPostCard(post){
  let body = '';

  if (post.type === 'ama') {
    body += typePillHTML('ama');
    body += `
      <div class="pc-ama-card">
        <div class="pc-ama-live-row">
          <div class="pc-ama-live-dot"></div>
          <div class="pc-ama-live-text">Live now</div>
          <div class="pc-ama-viewers"><i class="far fa-eye"></i> ${fmtN(post.amaData.viewers)} watching</div>
        </div>
        <div class="pc-ama-title">${post.amaData.title}</div>
        <div class="pc-ama-meta">${post.amaData.meta}</div>
        <button class="pc-ama-join" data-pc-join><i class="fas fa-microphone"></i> Join AMA</button>
      </div>`;
  }

  else if (post.type === 'chapter-drop') {
    body += typePillHTML('chapter-drop');
    if (post.text) body += `<div class="pc-text">${post.text}</div>`;
    const c = post.chapterRef;
    body += `
      <div class="pc-chapter-card" data-pc-open-chapter='${escAttr(JSON.stringify(c))}'>
        <div class="pc-chapter-cover" style="background-image:url('${c.cover}')">
          <div class="pc-chapter-scrim"></div>
          <div class="pc-chapter-textwrap">
            <div class="pc-chapter-eyebrow">${c.ch}</div>
            <div class="pc-chapter-title">${c.title}</div>
            <div class="pc-chapter-sub">${c.cat}</div>
          </div>
        </div>
        <div class="pc-chapter-panel">
          <div class="pc-chapter-desc">New chapter just dropped — tap to jump straight in.</div>
          <button class="pc-read-btn"><i class="fas fa-book-open"></i> Read Now</button>
        </div>
      </div>`;
  }

  else if (post.type === 'quote') {
    body += typePillHTML('quote');
    body += `
      <div class="pc-quote-card">
        <div class="pc-quote-mark">&ldquo;</div>
        <div class="pc-quote-text">${post.quote}</div>
        <div class="pc-quote-caption">${post.caption}</div>
      </div>`;
  }

  else if (post.type === 'repost') {
    body += typePillHTML('repost');
    if (post.note) body += `<div class="pc-repost-note">${post.note}</div>`;
    const o = post.original;
    body += `
      <div class="pc-repost-inner" data-pc-open-chapter='${escAttr(JSON.stringify({title:o.title,cover:o.cover}))}'>
        <div class="pc-repost-inner-head">
          <img class="pc-repost-inner-av" src="${o.avatar}" alt="${escAttr(o.name)}">
          <div><div class="pc-repost-inner-name">${o.name}</div><div class="pc-repost-inner-time">${o.time}</div></div>
        </div>
        <div class="pc-repost-inner-text">${o.text}</div>
        ${o.cover ? `<img class="pc-image" style="margin:9px 0 0;max-height:160px" src="${o.cover}" alt="">` : ''}
      </div>`;
  }

  else if (post.type === 'recommendation') {
    body += typePillHTML('recommendation');
    if (post.note) body += `<div class="pc-recommend-note">${post.note}</div>`;
    const s = post.storyRef;
    body += `
      <div class="pc-recommend-card" data-pc-open-chapter='${escAttr(JSON.stringify(s))}'>
        <img class="pc-recommend-cover" src="${s.cover}" alt="">
        <div class="pc-recommend-body">
          <div class="pc-recommend-badge">${s.cat || 'Recommended read'}</div>
          <div class="pc-recommend-title">${s.title}</div>
          <div class="pc-recommend-author">by @${s.author}</div>
        </div>
      </div>`;
  }

  else if (post.type === 'review') {
    body += typePillHTML('review');
    const s = post.storyRef;
    body += `
      <div class="pc-review-card">
        <div class="pc-review-top" data-pc-open-chapter='${escAttr(JSON.stringify(s))}'>
          <img class="pc-review-cover" src="${s.cover}" alt="">
          <div class="pc-review-storyinfo">
            <div class="pc-review-storytitle">${s.title}</div>
            <div style="font-size:10px;color:var(--tx-faint);margin-bottom:4px">by @${s.author}</div>
            <div class="pc-review-stars">${starsHTML(post.score)}<span class="pc-review-score">${post.score}.0</span></div>
          </div>
        </div>
        <div class="pc-review-body">${post.reviewText}</div>
      </div>`;
  }

  else if (post.type === 'poll' && post.poll) {
    body += typePillHTML('poll');
    body += `<div class="pc-poll-q">${post.poll.question}</div>`;
    const total = post.poll.total || post.poll.opts.reduce((a,o)=>a+o.v,0) || 1;
    body += post.poll.opts.map((o,i) => {
      const pct = Math.round((o.v/total)*100) || 0;
      return `
      <div class="pc-poll-row" data-pc-poll-opt="${i}">
        <div class="pc-poll-label"><span>${o.label}${post.poll.voted===i?' <span class=\"pc-poll-voted\">· your vote</span>':''}</span><span>${pct}%</span></div>
        <div class="pc-poll-track"><div class="pc-poll-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
    body += `<div class="pc-poll-footer"><span>${post.poll.voted>=0?'Tap results to see more':'Tap an option to vote'}</span><span>${total} votes</span></div>`;
  }

  else if (post.type === 'debate' && post.debateData) {
    body += typePillHTML('debate');
    body += `<div class="pc-debate-q">${post.debateData.question}</div>`;
    if (post.debateData.prompt) body += `<div class="pc-debate-prompt">${post.debateData.prompt}</div>`;
    const voted = post.debateData.userVote;
    body += `
      <div class="pc-debate-opts">
        <div class="pc-debate-opt for${voted==='for'?' picked':''}" data-pc-debate="for">
          <div class="pc-debate-opt-text">${post.debateData.forText||'For'}</div>
          <div class="pc-debate-icon"><i class="fas fa-thumbs-up"></i></div>
        </div>
        <div class="pc-debate-opt against${voted==='against'?' picked':''}" data-pc-debate="against">
          <div class="pc-debate-opt-text">${post.debateData.againstText||'Against'}</div>
          <div class="pc-debate-icon"><i class="fas fa-thumbs-down"></i></div>
        </div>
      </div>
      <div class="pc-debate-footer"><span>${(post.debateData.forV||0)+(post.debateData.agV||0)} joined the discussion</span><span>View Discussion <i class="fas fa-chevron-right"></i></span></div>`;
  }

  else if (post.type === 'sponsored' && post.sponsored) {
    const sp = post.sponsored;
    body += typePillHTML('sponsored');
    body += `
      <div class="pc-sponsored-cover" style="background-image:url('${sp.cover}')">
        <div class="pc-sponsored-scrim"></div>
        <div style="position:relative">
          <div class="pc-sponsored-title">${sp.title}</div>
          <div class="pc-sponsored-sub">${sp.sub}</div>
        </div>
      </div>
      <div class="pc-sponsored-desc">${sp.desc}</div>
      <div class="pc-sponsored-btn" data-pc-open-chapter='${escAttr(JSON.stringify({title:sp.title,cover:sp.cover}))}'>Read Now →</div>`;
    return `<div class="pc-post" data-pc-id="${post.id}">${pcHead(post)}${body}</div>`;
  }

  else {
    body += typePillHTML('post');
    if (post.text) body += `<div class="pc-text">${post.text}</div>`;
    if (post.image) body += `<img class="pc-image" src="${post.image}" alt="">`;
  }

  return `<div class="pc-post" data-pc-id="${post.id}">${pcHead(post)}${body}${pcActions(post)}</div>`;
}

function renderFeedPosts(){
  document.getElementById('feedList').innerHTML = FEED_POSTS.map(renderPostCard).join('');
}
function findPost(id){ return FEED_POSTS.find(p => p.id === id); }

function initFeedPosts(){
  const list = document.getElementById('feedList');
  list.addEventListener('click', (e) => {
    const card = e.target.closest('.pc-post');
    if (!card) return;
    const post = findPost(card.dataset.pcId);
    if (!post) return;

    if (e.target.closest('[data-pc-like]')) {
      post.liked = !post.liked;
      post.likes += post.liked ? 1 : -1;
      const btn = card.querySelector('[data-pc-like]');
      btn.classList.toggle('liked', post.liked);
      btn.querySelector('i').className = post.liked ? 'fa-heart fas' : 'fa-heart far';
      card.querySelector('[data-pc-like-ct]').textContent = fmtN(post.likes);
      return;
    }
    if (e.target.closest('[data-pc-save]')) {
      const btn = card.querySelector('[data-pc-save]');
      const on = btn.classList.toggle('on');
      btn.querySelector('i').className = on ? 'fas fa-bookmark' : 'far fa-bookmark';
      toast(on ? '🔖 Saved!' : 'Removed from saved');
      return;
    }
    if (e.target.closest('[data-pc-comment]')) { toast('💬 Opening comments…'); return; }
    if (e.target.closest('[data-pc-share]')) { toast('🔗 Link copied!'); return; }
    if (e.target.closest('[data-pc-dots]')) { toast('More options…'); return; }
    if (e.target.closest('[data-pc-join]')) { toast('🎙️ Joining AMA…'); return; }
    if (e.target.closest('[data-pc-open-chapter]')) { toast('📖 Opening story…'); return; }
    if (e.target.closest('[data-pc-avatar]')) { toast('👀 Viewing profile…'); return; }

    const pollRow = e.target.closest('[data-pc-poll-opt]');
    if (pollRow && post.poll) {
      if (post.poll.voted >= 0) { toast('✅ Already voted!'); return; }
      const i = +pollRow.dataset.pcPollOpt;
      post.poll.opts[i].v++;
      post.poll.voted = i;
      post.poll.total = (post.poll.total || 0) + 1;
      renderFeedPosts();
      toast('✅ Vote cast!');
      return;
    }
    const debateOpt = e.target.closest('[data-pc-debate]');
    if (debateOpt && post.debateData) {
      if (post.debateData.userVote) { toast('✅ Already voted!'); return; }
      const side = debateOpt.dataset.pcDebate;
      post.debateData.userVote = side;
      if (side === 'for') post.debateData.forV = (post.debateData.forV||0)+1;
      else post.debateData.agV = (post.debateData.agV||0)+1;
      renderFeedPosts();
      toast(side === 'for' ? '✅ Voted FOR!' : '❌ Voted AGAINST!');
      return;
    }
  });
  renderFeedPosts();
}

document.querySelectorAll('.f-tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.f-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
  });
});

/* ══════════════════════════════
   POST COMPOSER
══════════════════════════════ */
function openPostComposer(type) {
  document.getElementById('postComposerOv').classList.add('open');
  document.body.style.overflow = 'hidden';
  if(type) document.querySelectorAll('.ctype').forEach(t => t.classList.toggle('active', t.dataset.ct===type));
}
function closePostComposer() { document.getElementById('postComposerOv').classList.remove('open'); document.body.style.overflow=''; }
document.querySelectorAll('.ctype').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ctype').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
function submitPost() {
  const text = document.getElementById('composerText').value.trim();
  if (!text) { toast('✍️ Write something first!'); return; }
  FEED_POSTS.unshift({
    id: 'p_' + Date.now(), type:'post', name:'You', avatar: YOU_AV,
    time:'Just now', text, likes:0, liked:false, comments:0,
  });
  closePostComposer();
  document.getElementById('composerText').value = '';
  renderFeedPosts();
  toast('✅ Post published!');
}

   INIT

renderStories();
initFeedPosts();

  });
}
