<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DroBoard — Home</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{
  --bg:#000000;
  --pink:#ef1958;
  --pink2:#ff3d78;
  --purple:#7b2ff0;
  --purple2:#a35bff;
  --gold:#f2a900;
  --gold2:#ffd35c;
  --gray:#a9a9b2;
  --gray2:#7a7a84;
  --line:rgba(255,255,255,.09);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#050505;color:#fff;font-family:'Inter',system-ui,sans-serif}
img{display:block;max-width:100%}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
::-webkit-scrollbar{display:none}

.phone-wrap{display:flex;justify-content:center;padding:26px 12px}
.phone{
  width:390px;max-width:100%;background:var(--bg);border-radius:36px;
  box-shadow:0 30px 90px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05);
  overflow:hidden;position:relative;
}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 18px 6px}
.logo{font-family:'Playfair Display',serif;font-size:26px;font-weight:800;letter-spacing:-.3px}
.logo .b{color:var(--pink)}
.top-right{display:flex;align-items:center;gap:10px}
.coin-pill{
  display:flex;align-items:center;gap:7px;background:#16161a;border:1px solid var(--line);
  border-radius:20px;padding:6px 14px 6px 6px;font-size:13.5px;font-weight:800;color:#fff;
}
.coin-ico{
  width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd35c,#f2a900);
  color:#7a4a00;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;
}
.bell-btn{width:38px;height:38px;border-radius:50%;background:#16161a;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;position:relative}
.bell-badge{position:absolute;top:-4px;right:-5px;background:var(--pink);color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:10px;border:2px solid #050505;line-height:1.1}

/* ── STORIES ── */
.stories{display:flex;gap:16px;overflow-x:auto;padding:16px 18px 10px;scrollbar-width:none}
.story{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;width:60px}
.story-add{
  width:56px;height:56px;border-radius:50%;border:2px dashed var(--pink);display:flex;align-items:center;justify-content:center;
  color:var(--pink);font-size:18px;
}
.story-ring{width:56px;height:56px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,var(--pink),#ff6b93)}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #050505;display:block}
.story-name{font-size:10.5px;font-weight:600;color:#fff;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}

/* ── TABS ── */
.tabs{display:flex;align-items:center;gap:26px;padding:8px 18px 14px;border-bottom:1px solid var(--line)}
.tab{font-size:14.5px;font-weight:700;color:var(--gray2);padding-bottom:12px;position:relative;display:flex;align-items:center;gap:5px}
.tab.on{color:var(--pink)}
.tab.on i{font-size:10px}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px;background:var(--pink)}

.feed{padding:20px 16px 4px}

/* ── DIVIDER BETWEEN CARDS ── */
.feed-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14) 50%,transparent);margin:26px 0}

/* ── STORY CARD ── */
.story-card{
  position:relative;border-radius:26px;overflow:hidden;border:1.5px solid var(--pink);
  box-shadow:0 0 0 1px rgba(239,25,88,.15),0 20px 50px -18px rgba(239,25,88,.35);
  height:780px;background-size:cover;background-position:center;
}
.card-top-row{position:absolute;top:16px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.new-badge{
  display:flex;align-items:center;gap:6px;background:var(--pink);color:#fff;font-size:11px;font-weight:800;
  padding:7px 14px;border-radius:20px;box-shadow:0 6px 16px -4px rgba(239,25,88,.7);
}
.card-more{color:#fff;font-size:18px;letter-spacing:2px;padding:4px 6px}

.card-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.15) 42%,rgba(0,0,0,.7) 68%,rgba(2,0,4,.97) 100%)}

.card-body{position:absolute;left:0;right:0;bottom:0;padding:0 20px 22px;z-index:3}
.card-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:800;line-height:1.28;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5);margin-bottom:14px}
.card-author-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.card-author-av{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0}
.card-author-name{font-size:13.5px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
.card-author-name i{color:var(--pink);font-size:12px}
.card-chapter-row{font-size:13.5px;font-weight:700;color:#fff;margin-bottom:10px}
.card-chapter-row .dot{color:var(--gray2);margin:0 6px}
.card-chapter-row .when{color:var(--pink);font-weight:700}
.card-desc{font-size:13px;line-height:1.55;color:#d7d7dd;font-weight:500;margin-bottom:18px}

.continue-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-size:15px;font-weight:800;
  padding:16px 22px;border-radius:16px;box-shadow:0 12px 26px -8px rgba(239,25,88,.65);margin-bottom:12px;
}
.continue-btn i{font-size:17px}

.progress-lbl{font-size:11.5px;font-weight:700;color:var(--pink);margin-bottom:7px}
.progress-track{height:5px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
.progress-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--pink),var(--pink2))}

/* ── FLOATING ACTION RAIL ── */
.action-rail{
  position:absolute;right:14px;bottom:230px;z-index:4;
  display:flex;flex-direction:column;align-items:center;gap:20px;
  background:rgba(10,8,12,.55);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.12);border-radius:30px;padding:18px 12px;
}
.rail-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.rail-ico{font-size:21px;color:#fff}
.rail-ico.heart{color:var(--pink)}
.rail-lbl{font-size:11px;font-weight:700;color:#fff}

/* ── AD CARD ── */
.ad-card{
  position:relative;border-radius:24px;overflow:hidden;padding:26px 22px;
  border:1.5px solid rgba(255,255,255,.1);
}
.ad-card.premium{background:linear-gradient(135deg,#3d0f96 0%,#5b1bc9 55%,#7b2ff0 100%);box-shadow:0 20px 50px -20px rgba(123,47,240,.5)}
.ad-card.coins{background:linear-gradient(135deg,#3a2400 0%,#7a4a00 55%,#f2a900 130%);box-shadow:0 20px 50px -20px rgba(242,169,0,.4)}
.ad-tag{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.35);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.2)}
.ad-ico{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;margin-bottom:16px}
.ad-title{font-size:20px;font-weight:800;line-height:1.3;color:#fff;margin-bottom:8px}
.ad-sub{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.85);line-height:1.5;margin-bottom:18px}
.ad-list{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.ad-list div{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:rgba(255,255,255,.92)}
.ad-list i{font-size:11px;color:#3ddc84}
.ad-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;font-size:13px;font-weight:800;padding:11px 20px;border-radius:22px}
.ad-btn.premium-btn{color:var(--purple)}
.ad-btn.coins-btn{color:#7a4a00}

/* ── BOTTOM NAV ── */
.bnav{
  display:flex;justify-content:space-around;align-items:center;padding:12px 0 10px;
  background:#000;border-top:1px solid var(--line);position:sticky;bottom:0;
}
.bn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--gray2);position:relative}
.bn i{font-size:20px}
.bn.on{color:var(--pink)}
.bn .dot{position:absolute;top:-2px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--pink)}
.home-indicator{width:130px;height:5px;border-radius:5px;background:#fff;margin:6px auto 6px}
</style>
</head>
<body>
<div class="phone-wrap">
<div class="phone">

  <div class="topbar">
    <div class="logo">Dro<span class="b">Board</span></div>
    <div class="top-right">
      <div class="coin-pill"><span class="coin-ico">C</span>2,450</div>
      <div class="bell-btn"><i class="fas fa-bell"></i><span class="bell-badge">9+</span></div>
    </div>
  </div>

  <div class="stories">
    <div class="story">
      <div class="story-add"><i class="fas fa-plus"></i></div>
      <div class="story-name">Add</div>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://i.pravatar.cc/100?img=32" alt=""/></div>
      <div class="story-name">@Ada_Writes</div>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://i.pravatar.cc/100?img=68" alt=""/></div>
      <div class="story-name">@Campfire&hellip;</div>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://i.pravatar.cc/100?img=47" alt=""/></div>
      <div class="story-name">@Ifeanyi_St&hellip;</div>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://i.pravatar.cc/100?img=53" alt=""/></div>
      <div class="story-name">@Dami_Reads</div>
    </div>
    <div class="story">
      <div class="story-ring"><img src="https://i.pravatar.cc/100?img=44" alt=""/></div>
      <div class="story-name">@Chiamaka_N</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on">Following <i class="fas fa-chevron-down"></i></div>
    <div class="tab">For You</div>
    <div class="tab">Latest</div>
  </div>

  <div class="feed" id="feed"></div>

  <div class="bnav">
    <div class="bn on"><i class="fas fa-house"></i>Home</div>
    <div class="bn"><i class="fas fa-compass"></i>Discover</div>
    <div class="bn"><i class="fas fa-magnifying-glass"></i>Search</div>
    <div class="bn"><i class="far fa-comment"></i>Feed<span class="dot"></span></div>
    <div class="bn"><i class="far fa-user"></i>Profile</div>
  </div>
  <div class="home-indicator"></div>

</div>
</div>

<script>
const FEED_ITEMS = [
  { type:'story', img:'https://i.postimg.cc/MXBR6bfY/wolf3.jpg', title:"I came home early and caught my husband kissing my late sister's photograph",
    author:'Ada Writes', av:'https://i.pravatar.cc/100?img=32', chapter:'Chapter 23', when:'Just now',
    desc:'My body froze. He held the frame like someone begging forgiveness from a ghost.',
    progress:68, likes:'24.3K', comments:'4.1K', saves:'2.8K' },

  { type:'story', img:'https://i.postimg.cc/WF1j4Pnh/6.jpg', title:'Betrayed by the Mafia Prince',
    author:'Marcus Webb Jr.', av:'https://i.pravatar.cc/100?img=15', chapter:'Chapter 8', when:'12m ago',
    desc:'Dante trusted no one — until the one person he let in turned out to be working for the family that wants him dead.',
    progress:34, likes:'18.7K', comments:'2.9K', saves:'1.6K' },

  { type:'story', img:'https://i.postimg.cc/fkdXzjS8/wolf.jpg', title:'Bound by the Ruthless Alpha',
    author:'Chioma Okafor', av:'https://i.pravatar.cc/100?img=25', chapter:'Chapter 31', when:'40m ago',
    desc:'Chained to an alpha who broke her trust once already, Amara must decide if loyalty is worth risking her heart again.',
    progress:81, likes:'31.5K', comments:'5.4K', saves:'3.2K' },

  { type:'ad', theme:'premium', tag:'SPONSORED', icon:'fa-crown',
    title:'Unlock unlimited stories & perks', sub:'Go Premium and read without limits.',
    perks:['Ad-free reading','Early chapter access','Exclusive stories'], cta:'Go Premium' },

  { type:'story', img:'https://i.postimg.cc/23WvkFLH/images-(2).jpg', title:"The CEO's Hidden Son",
    author:'Luna Skye', av:'https://i.pravatar.cc/100?img=12', chapter:'Chapter 24', when:'1h ago',
    desc:'One accidental meeting threatens to unravel a decade of carefully guarded secrets.',
    progress:52, likes:'27.1K', comments:'3.8K', saves:'2.1K' },

  { type:'story', img:'https://i.postimg.cc/tY7KnJyr/images.jpg', title:'The Runaway Bride in Socked Feet',
    author:'Ifeanyi_Story', av:'https://i.pravatar.cc/100?img=53', chapter:'Chapter 22', when:'2h ago',
    desc:'She walked out of her own wedding with nothing but her phone and a plan — but her new life comes with secrets of its own.',
    progress:90, likes:'45.0K', comments:'6.7K', saves:'5.1K' },

  { type:'story', img:'https://i.postimg.cc/N9jY0w4m/5.jpg', title:'The Letter He Never Sent',
    author:'Efe_O', av:'https://i.pravatar.cc/100?img=22', chapter:'Chapter 15', when:'3h ago',
    desc:'Ten years after he disappeared, a folded letter turns up in his old jacket pocket — and everything falls apart.',
    progress:44, likes:'21.8K', comments:'3.6K', saves:'2.4K' },

  { type:'ad', theme:'coins', tag:'AD', icon:'fa-coins',
    title:'Get 500 Bonus Coins', sub:'Limited time offer — top up today and unlock your next favorite chapter.',
    perks:['Instant delivery','Use on any story','No expiry'], cta:'Buy Now' },

  { type:'story', img:'https://i.postimg.cc/vDn9YLx5/wife2.jpg', title:'Caught Him Kissing Her Photograph',
    author:'Ada_Writes', av:'https://i.pravatar.cc/100?img=32', chapter:'Chapter 19', when:'5h ago',
    desc:"She came home early to celebrate their anniversary and found her husband kissing a photograph of a woman she'd never seen.",
    progress:60, likes:'19.4K', comments:'2.7K', saves:'1.9K' },

  { type:'story', img:'https://i.postimg.cc/DJwFzKgd/4.jpg', title:"My Grandmother's Will",
    author:'Chiamaka_N', av:'https://i.pravatar.cc/100?img=44', chapter:'Chapter 27', when:'6h ago',
    desc:"The will names her sole heir to a fortune she didn't know existed — on one condition.",
    progress:76, likes:'22.6K', comments:'4.0K', saves:'2.5K' },
];

function storyCardHtml(s){
  return `
  <div class="story-card" style="background-image:url('${s.img}')">
    <div class="card-scrim"></div>
    <div class="card-top-row">
      <div class="new-badge"><i class="fas fa-bolt"></i>NEW CHAPTER</div>
      <div class="card-more">&bull;&bull;&bull;</div>
    </div>
    <div class="action-rail">
      <div class="rail-item"><i class="fas fa-heart rail-ico heart"></i><div class="rail-lbl">${s.likes}</div></div>
      <div class="rail-item"><i class="far fa-comment rail-ico"></i><div class="rail-lbl">${s.comments}</div></div>
      <div class="rail-item"><i class="far fa-bookmark rail-ico"></i><div class="rail-lbl">${s.saves}</div></div>
      <div class="rail-item"><i class="fas fa-arrow-turn-up rail-ico" style="transform:rotate(90deg)"></i><div class="rail-lbl">Share</div></div>
    </div>
    <div class="card-body">
      <div class="card-title">${s.title}</div>
      <div class="card-author-row">
        <img class="card-author-av" src="${s.av}" alt=""/>
        <div class="card-author-name">${s.author} <i class="fas fa-circle-check"></i></div>
      </div>
      <div class="card-chapter-row">${s.chapter} <span class="dot">&bull;</span> <span class="when">${s.when}</span></div>
      <div class="card-desc">${s.desc}</div>
      <div class="continue-btn">Continue Reading <i class="fas fa-book-open"></i></div>
      <div class="progress-lbl">${s.progress}% complete</div>
      <div class="progress-track"><div class="progress-fill" style="width:${s.progress}%"></div></div>
    </div>
  </div>`;
}
function adCardHtml(a){
  return `
  <div class="ad-card ${a.theme}">
    <div class="ad-tag">${a.tag}</div>
    <div class="ad-ico"><i class="fas ${a.icon}"></i></div>
    <div class="ad-title">${a.title}</div>
    <div class="ad-sub">${a.sub}</div>
    <div class="ad-list">${a.perks.map(p=>`<div><i class="fas fa-check"></i>${p}</div>`).join('')}</div>
    <div class="ad-btn ${a.theme==='premium'?'premium-btn':'coins-btn'}">${a.cta} <i class="fas fa-arrow-right"></i></div>
  </div>`;
}

document.getElementById('feed').innerHTML = FEED_ITEMS.map((item,i)=>{
  const html = item.type==='story' ? storyCardHtml(item) : adCardHtml(item);
  const divider = i < FEED_ITEMS.length-1 ? '<div class="feed-divider"></div>' : '';
  return html + divider;
}).join('');
</script>
</body>
</html>
