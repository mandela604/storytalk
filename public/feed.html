<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DroBoard - Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #E91E63;
      --primary-dark: #C2185B;
      --purple: #7C3AED;
      --text: #1F2937;
      --text-secondary: #6B7280;
      --border: #E5E7EB;
      --bg: #F9FAFB;
      --white: #FFFFFF;
      --green: #10B981;
      --red: #EF4444;
      --orange: #F59E0B;
      --font-display: 'Manrope', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      font-weight: 400;
      background: #E5E7EB;
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    svg.icon {
      display: block;
      flex-shrink: 0;
    }

    .phone {
      width: 100%;
      max-width: 390px;
      background: var(--white);
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 12px;
      background: var(--white);
    }

    .logo {
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .logo span {
      color: var(--primary);
    }

    .header-icons {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .icon-btn {
      position: relative;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -6px;
      background: var(--primary);
      color: white;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Tabs */
    .tabs {
      display: flex;
      padding: 0 16px;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      background: var(--white);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      padding: 12px 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      position: relative;
    }

    .tab.active {
      color: var(--primary);
      font-weight: 700;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
      border-radius: 2px 2px 0 0;
    }

    /* Main content */
    .content {
      flex: 1;
      overflow-y: auto;
      background: var(--bg);
      padding-bottom: 80px;
    }

    /* Composer */
    .composer {
      background: var(--white);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .composer-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
      flex-shrink: 0;
    }

    .avatar.sm { width: 32px; height: 32px; }
    .avatar.xs { width: 24px; height: 24px; }

    .composer-input {
      flex: 1;
      border: none;
      outline: none;
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--text-secondary);
      background: transparent;
    }

    .composer-send {
      width: 32px;
      height: 32px;
      background: #FCE7F3;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      flex-shrink: 0;
    }

    .composer-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--white);
      cursor: pointer;
      color: var(--text);
    }

    .action-btn.photo { color: #3B82F6; }
    .action-btn.chapter { color: #8B5CF6; }
    .action-btn.poll { color: #10B981; }
    .action-btn.debate { color: #F59E0B; }

    /* Stories */
    .stories {
      background: var(--white);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stories::-webkit-scrollbar { display: none; }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 64px;
      cursor: pointer;
    }

    .story-ring {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(45deg, #E91E63, #7C3AED, #F59E0B);
      position: relative;
    }

    .story-ring.own {
      background: #E5E7EB;
    }

    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid white;
      object-fit: cover;
    }

    .story-add {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 20px;
      height: 20px;
      background: var(--primary);
      border-radius: 50%;
      border: 2px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .story-name {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
      text-align: center;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Post card */
    .post {
      background: var(--white);
      margin-top: 8px;
      padding: 14px 16px;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .post-meta {
      flex: 1;
    }

    .post-author {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .verified {
      color: #3B82F6;
      display: flex;
      align-items: center;
    }

    .post-time {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .post-type {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-body);
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .post-type.chapter { color: #8B5CF6; }
    .post-type.author { color: #F59E0B; }
    .post-type.contest { color: var(--purple); }
    .post-type.sponsored { color: var(--primary); }
    .post-type.debate { color: var(--purple); }

    .poll-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #10B981;
      font-size: 12px;
      font-weight: 600;
    }

    .post-content {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .post-content strong {
      font-weight: 700;
    }

    /* Chapter card */
    .chapter-card {
      display: flex;
      gap: 12px;
      background: #1a1a2e;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .chapter-cover {
      width: 100px;
      height: 130px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .chapter-info {
      padding: 12px 12px 12px 0;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .chapter-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .chapter-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 6px;
    }

    .chapter-desc {
      font-size: 12px;
      font-weight: 400;
      color: #ccc;
      line-height: 1.4;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .read-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
    }

    /* Engagement row */
    .engagement {
      display: flex;
      align-items: center;
      gap: 20px;
      padding-top: 4px;
    }

    .eng-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      background: none;
      border: none;
    }

    .eng-item.liked {
      color: var(--primary);
    }

    .eng-spacer {
      flex: 1;
    }

    .bookmark-btn {
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    /* Regular image post */
    .post-image {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 10px;
      object-fit: cover;
      max-height: 220px;
    }

    .linked-story {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border-radius: 10px;
      padding: 8px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .linked-story img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
    }

    .linked-info {
      flex: 1;
    }

    .linked-title {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
    }

    .linked-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .linked-story .chevron {
      color: var(--text-secondary);
      display: flex;
    }

    /* Poll */
    .poll-options {
      margin: 12px 0;
    }

    .poll-option {
      margin-bottom: 10px;
    }

    .poll-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .poll-bar {
      height: 8px;
      background: #E5E7EB;
      border-radius: 4px;
      overflow: hidden;
    }

    .poll-fill {
      height: 100%;
      border-radius: 4px;
    }

    .poll-fill.pink { background: var(--primary); }
    .poll-fill.purple { background: #8B5CF6; }
    .poll-fill.orange { background: #F59E0B; }

    .poll-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .vote-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--primary);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      border: none;
      background: none;
    }

    /* Debate */
    .debate-question {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .debate-prompt {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    .debate-options {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .debate-opt {
      flex: 1;
      border: 1.5px solid;
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
    }

    .debate-opt.yes {
      border-color: #A7F3D0;
      background: #ECFDF5;
    }

    .debate-opt.no {
      border-color: #FECACA;
      background: #FEF2F2;
    }

    .debate-opt-text {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .debate-opt.yes .debate-opt-text { color: #065F46; }
    .debate-opt.no .debate-opt-text { color: #991B1B; }

    .debate-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .debate-opt.yes .debate-icon { color: #10B981; }
    .debate-opt.no .debate-icon { color: #EF4444; }

    .join-btn {
      border: none;
      padding: 6px 16px;
      border-radius: 20px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .debate-opt.yes .join-btn {
      background: #D1FAE5;
      color: #065F46;
    }

    .debate-opt.no .join-btn {
      background: #FEE2E2;
      color: #991B1B;
    }

    .debate-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .debate-avatars {
      display: flex;
      align-items: center;
    }

    .debate-avatars img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid white;
      margin-left: -6px;
    }

    .debate-avatars img:first-child {
      margin-left: 0;
    }

    .view-disc {
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    /* Contest banner */
    .contest-banner {
      background: linear-gradient(135deg, #5B21B6, #7C3AED);
      border-radius: 14px;
      padding: 16px;
      color: white;
      position: relative;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .contest-banner h3 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
      max-width: 75%;
    }

    .contest-banner p {
      font-size: 13px;
      font-weight: 500;
      opacity: 0.9;
      margin-bottom: 12px;
      max-width: 70%;
    }

    .enter-btn {
      background: white;
      color: var(--purple);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .trophy {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.25;
      color: white;
    }

    /* Sponsored */
    .sponsored-card {
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
    }

    .sponsored-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .sponsored-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      color: white;
    }

    .sponsored-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .sponsored-author {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.9;
      margin-bottom: 6px;
    }

    .sponsored-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .tag {
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }

    .sponsored-desc {
      font-size: 12px;
      font-weight: 400;
      opacity: 0.85;
      margin-bottom: 10px;
    }

    .read-now {
      color: var(--primary);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 13px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Premium promo */
    .premium-card {
      background: linear-gradient(135deg, #1a1a2e, #2d1b4e);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      gap: 12px;
      color: white;
      margin-bottom: 4px;
    }

    .premium-card img {
      width: 80px;
      height: 100px;
      border-radius: 8px;
      object-fit: cover;
    }

    .premium-info h3 {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .premium-info ul {
      list-style: none;
      margin-bottom: 10px;
    }

    .premium-info li {
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #E5E7EB;
    }

    .premium-info li .icon {
      color: #10B981;
    }

    .premium-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Invite card */
    .invite-card {
      background: linear-gradient(90deg, #FDF2F8, #FEF3C7);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .invite-text {
      flex: 1;
    }

    .invite-text h4 {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 2px;
    }

    .invite-text p {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .invite-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .invite-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
    }

    .invite-icons .coin { color: var(--orange); }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      background: var(--white);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 20px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px 12px;
    }

    .nav-item.active {
      color: var(--primary);
    }

    /* Author post image */
    .author-image {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 10px;
      max-height: 180px;
      object-fit: cover;
    }

    .more-btn {
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    /* Completed badge */
    .completed-badge {
      background: #10B981;
      color: white;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="phone">
    <!-- Header -->
    <div class="header">
      <div class="logo">Dro<span>Board</span></div>
      <div class="header-icons">
        <div class="icon-btn" id="bell-btn"></div>
        <div class="icon-btn" id="gift-btn"></div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active">Following</div>
      <div class="tab">For You</div>
      <div class="tab">Trending</div>
      <div class="tab">My Circles</div>
    </div>

    <!-- Content -->
    <div class="content" id="feed"></div>

    <!-- Bottom Nav -->
    <div class="bottom-nav" id="bottom-nav"></div>
  </div>

  <script>
    /* =========================================================
       CUSTOM ICON SET (single consistent line-icon style,
       used everywhere instead of emoji)
    ========================================================= */
    const ICON_PATHS = {

                      ${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <div class="sponsored-desc">${item.desc}</div>
                    <button class="read-now">Read Now ${icon('chevronRight', { size: 14 })}</button>
                  </div>
                </div>
              </div>
            `;
            break;

          case 'completed':
            html += `
              <div class="post">
                <div class="post-header">
                  <img class="avatar sm" src="${item.avatar}" alt="${item.author}">
                  <div class="post-meta">
                    <div class="post-author">${item.author}</div>
                    <div class="post-time">${item.time}</div>
                  </div>
                  <div class="more-btn">${icon('moreHorizontal', { size: 18 })}</div>
                </div>
                <div class="post-content">${item.text}</div>
                <div class="linked-story">
                  <img src="${item.linked.cover}" alt="${item.linked.title}">
                  <div class="linked-info">
                    <div class="linked-title">${item.linked.title}</div>
                    <div class="linked-sub"><span class="completed-badge">${item.linked.status}</span></div>
                  </div>
                  <span class="chevron">${icon('chevronRight', { size: 18 })}</span>
                </div>
                <div class="engagement">
                  <div class="eng-item liked">${icon('heartFilled', { size: 17 })} ${item.likes}</div>
                  <div class="eng-item">${icon('messageCircle', { size: 17 })} ${item.comments}</div>
                  <div class="eng-item">${icon('share', { size: 16 })}</div>
                  <div class="eng-spacer"></div>
                  <div class="bookmark-btn">${icon('bookmark', { size: 17 })}</div>
                </div>
              </div>
            `;
            break;

          case 'invite':
            html += `
              <div class="invite-card">
                <div class="invite-text">
                  <h4>Invite your friends and earn coins!</h4>
                  <p>+50 coins per friend</p>
                  <button class="invite-btn">Invite Now ${icon('chevronRight', { size: 14 })}</button>
                </div>
                <div class="invite-icons">
                  ${icon('gift', { size: 28 })}
                  <span class="coin">${icon('dollar', { size: 24 })}</span>
                </div>
              </div>
            `;
            break;
        }
      });

      container.innerHTML = html;
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });

    renderHeader();
    renderNav();
    renderFeed();
  </script>
</body>
</html>
