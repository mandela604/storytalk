<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DroBoard — Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#E91E63; --pink-deep:#C2185B; --pink-soft:#FCE7F3;
    --purple:#7C3AED; --purple-deep:#6D28D9; --purple-soft:#F1EBFF;
    --blue:#3B82F6; --blue-soft:#EAF2FE;
    --green:#10B981; --green-soft:#E7FBF3;
    --orange:#F59E0B; --orange-soft:#FEF3E2;
    --ink:#161620; --ink-2:#3A3650; --gray-600:#65627a; --gray-400:#9793a8;
    --line:#EDEDF2; --divider:#F0F1F5; --white:#FFFFFF;
    --font-display:'Manrope',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--divider);}
  body{font-family:var(--font-body);color:var(--ink);display:flex;justify-content:center;min-height:100vh;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  img{display:block;}
  svg.ic{display:block;flex-shrink:0;}
  ::-webkit-scrollbar{display:none;}

  .phone{width:100%;max-width:420px;min-height:100vh;background:var(--white);position:relative;box-shadow:0 0 50px rgba(0,0,0,.10);display:flex;flex-direction:column;}

  /* ===== HEADER ===== */
  .topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 16px 11px;}
  .logo{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
  .logo span{color:var(--pink);}
  .top-actions{display:flex;gap:10px;}
  .icon-btn{width:37px;height:37px;border-radius:50%;background:var(--divider);display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink-2);}
  .icon-btn.pink{background:var(--pink-soft);color:var(--pink-deep);}
  .badge-dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--pink);border:2px solid var(--white);}

  /* ===== TABS ===== */
  .tabs{display:flex;gap:22px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--white);overflow-x:auto;}
  .tab{padding:11px 0;font-size:13.5px;font-weight:600;color:var(--gray-400);white-space:nowrap;position:relative;}
  .tab.active{color:var(--pink);font-weight:700;}
  .tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:3px;background:var(--pink);}

  .feed{flex:1;padding-bottom:90px;background:var(--white);}

  /* ===== FULL-WIDTH POST SHELL (Facebook style) ===== */
  .post{width:100%;padding:14px 16px 12px;border-bottom:8px solid var(--divider);background:var(--white);}
  .post.tight{padding-bottom:14px;}

  /* ===== COMPOSER ===== */
  .composer-top{display:flex;align-items:center;gap:11px;}
  .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#ffb1c9,var(--pink));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0;}
  .composer-input{flex:1;background:var(--divider);border-radius:22px;padding:11px 16px;font-size:14px;color:var(--gray-400);}
  .composer-shortcuts{display:flex;justify-content:space-between;margin-top:13px;padding-top:12px;border-top:1px solid var(--line);}
  .shortcut{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
  .shortcut-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .shortcut span{font-size:11px;font-weight:600;color:var(--gray-600);}
  .sc-photo{background:var(--blue-soft);color:var(--blue);}
  .sc-chapter{background:var(--purple-soft);color:var(--purple-deep);}
  .sc-poll{background:var(--green-soft);color:#0d9668;}
  .sc-debate{background:var(--orange-soft);color:#c2610a;}

  /* ===== STORIES ===== */
  .stories{display:flex;gap:13px;padding:12px 16px;overflow-x:auto;}
  .story-item{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:58px;}
  .story-ring{width:56px;height:56px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,var(--pink),var(--purple),var(--orange));position:relative;}
  .story-ring.own{background:var(--line);}
  .story-ring .inner{width:100%;height:100%;border-radius:50%;background:#fff;padding:2px;}
  .story-avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
  .story-add{width:100%;height:100%;border-radius:50%;background:var(--divider);display:flex;align-items:center;justify-content:center;color:var(--pink);font-size:20px;font-weight:800;}
  .story-plus-badge{position:absolute;bottom:-1px;right:-1px;width:19px;height:19px;background:var(--pink);border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;}
  .story-name{font-size:10.5px;font-weight:600;color:var(--gray-600);max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ===== POST HEADER ===== */
  .post-head{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .post-meta{flex:1;min-width:0;}
  .post-name-row{display:flex;align-items:center;gap:5px;}
  .post-name{font-size:14px;font-weight:700;}
  .verified{width:14px;height:14px;color:var(--blue);flex-shrink:0;}
  .post-time{font-size:11.5px;color:var(--gray-400);margin-top:1px;}
  .head-right{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .icon-plain{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gray-400);}
  .icon-plain.on{color:var(--pink);}

  .type-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.01em;padding:5px 10px 5px 8px;border-radius:20px;margin-bottom:10px;}
  .type-pill svg{width:12px;height:12px;}
  .tp-chapter{background:var(--purple-soft);color:var(--purple-deep);}
  .tp-recommend{background:var(--blue-soft);color:#1d4ed8;}
  .tp-poll{background:var(--green-soft);color:#0d9668;}
  .tp-debate{background:var(--orange-soft);color:#c2610a;}
  .tp-author{background:var(--pink-soft);color:var(--pink-deep);}
  .tp-sponsor{background:var(--divider);color:var(--gray-600);}

  .post-text{font-size:14px;line-height:1.55;margin-bottom:11px;color:var(--ink-2);}

  /* ===== CHAPTER CARD — real photo cover, light info panel ===== */
  .chapter-card{border-radius:12px;overflow:hidden;margin-bottom:11px;border:1px solid var(--line);}
  .chapter-cover{width:100%;height:170px;position:relative;background-size:cover;background-position:center;}
  .chapter-cover-scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.15) 55%,transparent 100%);}
  .chapter-cover-text{position:absolute;left:14px;right:14px;bottom:12px;color:#fff;}
  .chapter-eyebrow{font-size:10px;font-weight:800;color:#ffc3d8;letter-spacing:.05em;margin-bottom:3px;}
  .chapter-title{font-family:var(--font-display);font-size:17px;font-weight:800;line-height:1.2;}
  .chapter-subtitle{font-size:12px;font-weight:600;opacity:.9;margin-top:2px;}
  .chapter-info-panel{padding:12px 14px;background:var(--white);}
  .chapter-desc{font-size:12.5px;color:var(--gray-600);line-height:1.5;margin-bottom:11px;}
  .read-btn{background:var(--pink);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;}

  /* ===== RECOMMENDATION / REACTION ===== */
  .rec-card{display:flex;align-items:center;gap:11px;background:var(--divider);border-radius:10px;padding:9px 10px;margin-bottom:11px;}
  .rec-thumb{width:42px;height:56px;border-radius:6px;flex-shrink:0;object-fit:cover;background:var(--line);}
  .rec-title{font-size:12.5px;font-weight:700;}
  .rec-sub{font-size:11px;color:var(--gray-400);margin-top:2px;}
  .rec-arrow{margin-left:auto;color:var(--gray-400);flex-shrink:0;}
  .post-image{width:100%;border-radius:12px;margin-bottom:11px;max-height:230px;object-fit:cover;border:1px solid var(--line);}

  /* ===== ACTION ROW ===== */
  .post-actions{display:flex;align-items:center;justify-content:space-between;padding-top:11px;border-top:1px solid var(--line);}
  .action{display:flex;align-items:center;gap:6px;color:var(--gray-600);}
  .action svg{width:18px;height:18px;}
  .action span{font-size:12.5px;font-weight:600;}
  .action.liked{color:var(--pink);}
  .action.liked svg{fill:var(--pink);stroke:var(--pink);}
  .action-group{display:flex;align-items:center;gap:22px;}

  /* ===== POLL ===== */
  .poll-q{font-size:14.5px;font-weight:700;margin-bottom:13px;line-height:1.4;}
  .poll-row{margin-bottom:9px;}
  .poll-label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px;}
  .poll-track{height:8px;border-radius:6px;background:var(--divider);overflow:hidden;}
  .poll-fill{height:100%;border-radius:6px;}
  .pf-1{background:var(--pink);}.pf-2{background:var(--purple);}.pf-3{background:var(--orange);}
  .poll-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .vote-btn{display:flex;align-items:center;gap:6px;color:var(--pink);font-weight:700;font-size:13px;}
  .poll-meta{font-size:11.5px;color:var(--gray-400);}

  /* ===== DEBATE ===== */
  .debate-q{font-family:var(--font-display);font-size:16.5px;font-weight:800;margin-bottom:4px;}
  .debate-prompt{font-size:12.5px;color:var(--gray-400);margin-bottom:13px;}
  .debate-opts{display:flex;gap:9px;margin-bottom:13px;}
  .debate-opt{flex:1;border-radius:12px;padding:14px 10px;text-align:center;border:1.5px solid;}
  .debate-opt.yes{background:var(--green-soft);border-color:#c9f0e0;}
  .debate-opt.no{background:var(--pink-soft);border-color:#fad2e2;}
  .debate-opt-text{font-size:12px;font-weight:700;line-height:1.3;margin-bottom:9px;}
  .debate-opt.yes .debate-opt-text{color:#0d7a56;}
  .debate-opt.no .debate-opt-text{color:var(--pink-deep);}
  .debate-icon{display:flex;justify-content:center;margin-bottom:8px;}
  .debate-opt.yes .debate-icon{color:var(--green);}
  .debate-opt.no .debate-icon{color:var(--pink);}
  .join-btn{border:none;padding:6px 15px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .debate-opt.yes .join-btn{background:#c9f3e0;color:#0d7a56;}
  .debate-opt.no .join-btn{background:#fbd2e2;color:var(--pink-deep);}
  .debate-footer{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--gray-400);}
  .debate-avatars{display:flex;align-items:center;}
  .debate-avatars .a{width:22px;height:22px;border-radius:50%;border:2px solid #fff;margin-left:-6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700;}
  .debate-avatars .a:first-child{margin-left:0;}
  .debate-joined-label{font-size:11.5px;color:var(--gray-400);margin-left:8px;}
  .view-disc{color:var(--pink);font-weight:700;display:flex;align-items:center;gap:3px;white-space:nowrap;}

  /* ===== CONTEST BANNER (accent promo, ok to be colorful) ===== */
  .contest-banner{background:linear-gradient(135deg,#8b3ff0,#c23fd9);border-radius:14px;padding:20px 16px;color:#fff;position:relative;overflow:hidden;}
  .contest-glow{position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14);top:-55px;right:-45px;}
  .contest-trophy{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin-bottom:12px;position:relative;}
  .contest-title{font-family:var(--font-display);font-size:16.5px;font-weight:800;margin-bottom:9px;position:relative;line-height:1.25;}
  .contest-tags{display:flex;gap:7px;margin-bottom:15px;position:relative;flex-wrap:wrap;}
  .contest-tag{background:rgba(255,255,255,.22);font-size:10.5px;font-weight:700;padding:5px 11px;border-radius:20px;}
  .enter-btn{background:#fff;color:var(--purple-deep);border:none;padding:9px 16px;border-radius:11px;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:5px;position:relative;}

  /* ===== SPONSORED STORY — real photo cover ===== */
  .sponsored-cover{height:170px;border-radius:12px;position:relative;overflow:hidden;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:14px;margin-bottom:11px;border:1px solid var(--line);}
  .sponsored-cover-scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.78) 10%,rgba(0,0,0,.1) 65%);}
  .sponsored-title{color:#fff;font-family:var(--font-display);font-size:17px;font-weight:800;line-height:1.25;position:relative;}
  .sponsored-author-line{color:#f1e2ea;font-size:11.5px;font-weight:500;position:relative;margin-top:3px;}
  .genre-pills{display:flex;gap:7px;margin-bottom:9px;}
  .genre-pill{background:var(--divider);color:var(--gray-600);font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;}
  .sponsored-desc{font-size:13px;color:var(--gray-600);line-height:1.5;margin-bottom:12px;}
  .read-now-btn{text-align:center;background:var(--pink);color:#fff;font-weight:700;font-size:13.5px;padding:11px;border-radius:11px;}

  /* ===== PREMIUM AD — light card, small photo, no dark gradient ===== */
  .premium-card{border-radius:12px;padding:14px;display:flex;gap:12px;background:var(--pink-soft);border:1px solid #f8d3e2;}
  .premium-cover{width:58px;height:76px;border-radius:8px;flex-shrink:0;object-fit:cover;}
  .premium-info h3{font-family:var(--font-display);font-size:14px;font-weight:800;margin-bottom:8px;color:var(--ink);}
  .premium-info ul{list-style:none;margin-bottom:11px;}
  .premium-info li{font-size:11.5px;font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:6px;color:var(--ink-2);}
  .premium-info li svg{width:13px;height:13px;color:var(--green);flex-shrink:0;}
  .premium-btn{background:var(--pink);color:#fff;border:none;padding:8px 15px;border-radius:20px;font-size:12.5px;font-weight:700;}

  /* ===== COMPLETED ===== */
  .completed-pill{background:var(--green);color:#fff;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:5px;display:inline-block;margin-top:2px;}

  /* ===== INVITE ===== */
  .invite-card{position:relative;background:linear-gradient(90deg,var(--pink-soft),var(--purple-soft));border-radius:14px;display:flex;border:1px solid var(--line);}
  .invite-main{flex:1;padding:15px 14px;position:relative;}
  .invite-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--pink-deep);text-transform:uppercase;margin-bottom:6px;}
  .invite-title{font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--ink);line-height:1.3;margin-bottom:10px;}
  .invite-btn2{background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;padding:9px 17px;border-radius:11px;display:inline-flex;align-items:center;gap:6px;}
  .invite-stub{width:96px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .invite-coin{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--orange);box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .invite-reward{font-size:12px;font-weight:800;color:var(--pink-deep);text-align:center;line-height:1.2;}
  .invite-reward small{display:block;font-size:9.5px;font-weight:600;color:var(--gray-600);}

  /* ===== BOTTOM NAV ===== */
  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:rgba(255,255,255,.98);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 0 22px;z-index:100;}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--gray-400);padding:4px 12px;}
  .nav-item.active{color:var(--pink);}
  .nav-item svg{width:21px;height:21px;}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="logo">Dro<span>Board</span></div>
    <div class="top-actions">
      <div class="wallet-pill" id="wallet-pill"></div>
      <div class="icon-btn" id="bell-btn"></div>
      <div class="icon-btn pink" id="gift-btn"></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active">Following</div>
    <div class="tab">For You</div>
    <div class="tab">Trending</div>
    <div class="tab">My Circles</div>
  </div>

  <div class="feed" id="feed"></div>

  <div class="bottom-nav" id="bottom-nav"></div>
</div>

  check:'<polyline points="20 6 9 17 4 12"/>',
  checkCircle:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',

function icon(name,{size=18,stroke=2,color}={}){
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color||'currentColor'}" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}
function initials(name){return (name||'?').trim()[0].toUpperCase();}
function grad(seed){
  const palettes=['#ff8fab,#c084fc','#38bdf8,#818cf8','#fbbf24,#fb7185','#34d399,#22d3ee','#f472b6,#a78bfa'];
  let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;
  return palettes[h%palettes.length];
}
function avEl(name,src,size=42){
  if(src) return `<img class="avatar" style="width:${size}px;height:${size}px" src="${src}" alt="${name}">`;
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${size*.33}px;background:linear-gradient(135deg,${grad(name)})">${initials(name)}</div>`;
}
function fmt(n){return n>=1000?(n/1000).toFixed(1).replace('.0','')+'k':n;}

function attachEvents(){
  document.querySelectorAll('.like-btn').forEach(el=>{
    el.addEventListener('click',()=>{
      el.classList.toggle('liked');
      const ct=el.querySelector('.like-ct');
      let n=parseFloat(ct.textContent);
      const liked=el.classList.contains('liked');
      ct.textContent=fmt(Math.max(0,Math.round(liked?n+1:n-1)));
    });
  });
  document.querySelectorAll('.save-btn').forEach(el=>{
    el.addEventListener('click',()=>el.classList.toggle('on'));
  });
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');});
  });
}
